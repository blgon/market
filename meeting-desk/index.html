  /* ---- 운영현황 ---- */
  function nf(v){ return v.toLocaleString('en-US'); }
  function money(v){ return '$' + v.toLocaleString('en-US'); }
  function lineChart(series, fmt){
    var W = 340, H = 148, L = 36, R = 52, T = 10, Bm = 22;
    var max = 0;
    series.forEach(function(s){ s.vals.forEach(function(v){ if (v > max) max = v; }); });
    max = max * 1.12 || 1;
    var iw = W - L - R, ih = H - T - Bm, n = series[0].vals.length;
    var x = function(i){ return L + (n === 1 ? iw / 2 : iw * i / (n - 1)); };
    var y = function(v){ return T + ih - ih * (v / max); };
    var g = '';
    for (var t = 0; t <= 3; t++) {
      var val = max * t / 3, yy = y(val);
      g += '<line x1="'+L+'" y1="'+yy.toFixed(1)+'" x2="'+(W-R)+'" y2="'+yy.toFixed(1)+
           '" stroke="var(--gridc)" stroke-width="1"/>'+
           '<text x="'+(L-7)+'" y="'+(yy+3.5).toFixed(1)+'" text-anchor="end" font-size="9.5" '+
           'fill="var(--ink3)" font-family="Archivo, sans-serif">'+fmt(val)+'</text>';
    }
    D.ops.months.forEach(function(m, i){
      if (i % 2) return;
      g += '<text x="'+x(i).toFixed(1)+'" y="'+(H-6)+'" text-anchor="middle" font-size="9.5" '+
           'fill="var(--ink3)" font-family="Archivo, sans-serif">'+esc(m)+'</text>';
    });
    series.forEach(function(s){
      var d = s.vals.map(function(v, i){ return (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1); }).join(' ');
      g += '<path d="'+d+'" fill="none" stroke="'+s.color+'" stroke-width="2" '+
           'stroke-linecap="round" stroke-linejoin="round"/>';
      s.vals.forEach(function(v, i){
        g += '<circle cx="'+x(i).toFixed(1)+'" cy="'+y(v).toFixed(1)+'" r="4" fill="'+s.color+
             '" stroke="var(--card)" stroke-width="1.5"/>';
      });
      var lv = s.vals[n-1];
      g += '<text x="'+(W-R+9)+'" y="'+(y(lv)+3.5).toFixed(1)+'" font-size="10.5" fill="var(--ink)" '+
           'font-family="Archivo, sans-serif" font-weight="600">'+fmt(lv)+'</text>';
    });
    return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="월별 추이 차트">'+g+'</svg>';
  }
  function gameRows(list, color){
    var max = list[0][2] || 1;
    return '<div class="grows">' + list.map(function(r){
      return '<div class="grow">'+
        '<span class="bar" style="width:'+(r[2]/max*100).toFixed(1)+'%;background:'+color+'"></span>'+
        '<span class="gi"><span class="gn">'+esc(r[0])+'</span>'+
        '<span class="gr">'+money(r[2])+'</span></span>'+
        '<span class="gm"><span>노출 '+nf(r[1])+'</span><span>DAU '+nf(r[3])+'</span>'+
        '<span>eCPM $'+r[4].toFixed(2)+'</span></span></div>';
    }).join('') + '</div>';
  }
  function renderOps(){
    var el = document.getElementById('viewOps');
    if (el.dataset.done) return;
    var o = D.ops, S1 = 'var(--s1)', S2 = 'var(--s2)';
    var h = '';
    h += '<div class="page-head"><span class="lbl">OPERATIONS</span><h2>자사 운영현황</h2>'+
         '<p>'+esc(o.asof)+' 광고 수익화 실적과 운영 방식 요약입니다. 출처: '+esc(o.src)+'.</p>'+
         '<div class="notice"><span>⚠</span><span><b>대외비.</b> 자사 실적 수치가 포함되어 있습니다. '+
         '미팅 중 참고용으로만 사용하고 화면 공유·배포는 피해 주세요.</span></div></div>';

    h += '<div class="gtitle"><span class="lbl">9월 요약</span></div><div class="tiles">'+
      '<div class="tile"><span class="tl">전체 IAA 수익</span><span class="tv">'+money(o.tot.rev)+
      '</span><span class="ts">노출 '+nf(o.tot.imp)+'</span></div>'+
      '<div class="tile"><span class="tl">전체 DAU</span><span class="tv">'+nf(o.tot.dau)+
      '</span><span class="ts">2개 법인 합계</span></div>'+
      o.co.map(function(c, i){
        return '<div class="tile '+(i?'b':'a')+'"><span class="tl">'+esc(c.n)+'</span>'+
          '<span class="tv">'+money(c.rev)+'</span>'+
          '<span class="ts">eCPM $'+c.ecpm.toFixed(2)+' · DAU '+nf(c.dau)+'</span></div>';
      }).join('')+
      '<div class="tile"><span class="tl">AdMob 수익 비중</span><span class="tv">'+o.mix.share+'%</span>'+
      '<span class="ts">AdMob 내 Bidding '+Math.round(o.mix.bidding/o.mix.sum*100)+'% / Waterfall '+
      Math.round(o.mix.waterfall/o.mix.sum*100)+'%</span></div>'+
      '</div>';

    h += '<div class="gtitle"><span class="lbl">월별 추이</span><span class="gc">2026년 1~9월</span></div>';
    var lg = '<div class="lg"><span><i style="background:'+S1+'"></i>Wemade Play</span>'+
             '<span><i style="background:'+S2+'"></i>Playlinks</span></div>';
    h += '<div class="chart"><h3>IAA 수익</h3><div class="cs">단위 USD · 월 합계</div>'+lg+
      lineChart([{color:S1, vals:o.wmpM.map(function(r){return r[1];})},
                 {color:S2, vals:o.plkM.map(function(r){return r[1];})}],
                function(v){ return '$' + Math.round(v/1000) + 'k'; })+'</div>';
    h += '<div class="chart" style="margin-top:8px"><h3>eCPM</h3><div class="cs">단위 USD</div>'+lg+
      lineChart([{color:S1, vals:o.wmpM.map(function(r){return r[4];})},
                 {color:S2, vals:o.plkM.map(function(r){return r[4];})}],
                function(v){ return '$' + v.toFixed(1); })+'</div>';
    h += '<div class="chart" style="margin-top:8px"><h3>DAU</h3><div class="cs">월 평균</div>'+lg+
      lineChart([{color:S1, vals:o.users.map(function(r){return r[1];})},
                 {color:S2, vals:o.users.map(function(r){return r[3];})}],
                function(v){ return Math.round(v/1000) + 'k'; })+'</div>';

    var mh = '<div class="tw" style="margin-top:8px"><table class="dt2"><thead><tr>'+
      '<th>월</th><th>WMP 수익</th><th>WMP eCPM</th><th>WMP ER</th>'+
      '<th>PLK 수익</th><th>PLK eCPM</th><th>PLK ER</th></tr></thead><tbody>';
    o.months.forEach(function(m, i){
      var a = o.wmpM[i], b = o.plkM[i];
      mh += '<tr><td>'+esc(m)+'</td><td>'+money(a[1])+'</td><td>$'+a[4].toFixed(2)+'</td><td>'+a[5]+'%</td>'+
            '<td>'+money(b[1])+'</td><td>$'+b[4].toFixed(2)+'</td><td>'+b[5]+'%</td></tr>';
    });
    mh += '</tbody></table></div>';
    h += mh;

    h += '<div class="gtitle"><span class="lbl">게임별 · Wemade Play</span><span class="gc">'+
         o.wmpG.length+'개 타이틀</span></div>' + gameRows(o.wmpG, S1);
    h += '<div class="gtitle"><span class="lbl">게임별 · Playlinks</span><span class="gc">'+
         o.plkG.length+'개 타이틀</span></div>' + gameRows(o.plkG, S2);

    h += '<div class="gtitle"><span class="lbl">운영 방식</span></div>';
    var bp = Math.round(o.mix.bidding/o.mix.sum*100);
    o.practice.forEach(function(pr, i){
      h += '<div class="pc"><div class="pc-hd"><h3>'+esc(pr.t)+'</h3>'+
           (pr.k ? '<span class="pill deep">'+esc(pr.k)+'</span>' : '')+'</div>';
      if (i === 0) {
        h += '<div class="mixbar"><i style="width:'+bp+'%;background:var(--s1)"></i>'+
             '<i style="width:'+(100-bp)+'%;background:var(--s2)"></i></div>'+
             '<div class="lg"><span><i style="background:var(--s1)"></i>Bidding '+bp+'%</span>'+
             '<span><i style="background:var(--s2)"></i>Waterfall '+(100-bp)+'%</span></div>';
      }
      h += '<ul class="ag-b" style="padding:0 0 0 13px">'+
           pr.b.map(function(x){ return '<li>'+esc(x)+'</li>'; }).join('')+'</ul></div>';
    });
    h += '<div class="pc fail" style="margin-top:8px"><div class="pc-hd">'+
         '<h3>'+esc(o.failure.t)+'</h3><span class="pill">실패 사례</span></div>'+
         '<ul class="ag-b" style="padding:0 0 0 13px">'+
         o.failure.b.map(function(x){ return '<li>'+esc(x)+'</li>'; }).join('')+'</ul></div>';
    el.innerHTML = h;
    el.dataset.done = '1';
  }

  /* ---- top-level views ---- */
  var VIEWS = {desk:'viewDesk', google:'viewGoogle', ops:'viewOps'};
  function setView(v, push){
    if (!VIEWS[v]) v = 'desk';
    if (v === 'google') renderAgenda();
    if (v === 'ops') renderOps();
    for (var k in VIEWS) document.getElementById(VIEWS[k]).hidden = (k !== v);
    document.getElementById('deskHead').hidden = (v !== 'desk');
    document.querySelectorAll('#vnav button').forEach(function(b){
      b.setAttribute('aria-selected', b.dataset.v === v ? 'true' : 'false');
    });
    S.view = v; save();
    if (push) { try { location.hash = v; } catch(e){} }
    window.scrollTo(0, 0);
  }
  document.getElementById('vnav').addEventListener('click', function(e){
    var b = e.target.closest('[data-v]'); if (b) setView(b.dataset.v, true);
  });
  window.addEventListener('hashchange', function(){
    var v = (location.hash || '').replace('#','');
    if (VIEWS[v] && v !== S.view) setView(v, false);
  });

  paintTabs(); render();
  var start = (location.hash || '').replace('#','');
  setView(VIEWS[start] ? start : (S.view || 'desk'), false);
})();
</script>

</body>
</html>
