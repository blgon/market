<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="AdMob Barcelona 2026 참석사 216개사 미팅 준비 — 현장 모바일용.">
<meta name="theme-color" content="#eceeea" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101418" media="(prefers-color-scheme: dark)">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Barcelona Meeting Desk</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
:root{
  --paper:#eceeea; --card:#fff; --card2:#f6f7f4; --ink:#161b21; --ink2:#49535d; --ink3:#77818b;
  --line:#d8dbd4; --line2:#e7e9e3; --accent:#0d6b5c; --accent-ink:#fff; --focus:#0d6b5c;
  --must:#a93726; --must-bg:#f7e5e1; --pri:#8f5d0c; --pri-bg:#f7edda;
  --field:#2b5c86; --field-bg:#e3ecf4; --chk:#63508b; --chk-bg:#ebe6f4;
  --low:#6c7883; --low-bg:#e8eaec; --own:#0d6b5c; --own-bg:#dfeee9;
  --hl:#fcf3cd; --hl-line:#e8d79b; --s1:#0a8a74; --s2:#7146b8; --gridc:#e4e6e0;
  --shadow:0 1px 2px rgba(20,26,32,.06),0 8px 24px -16px rgba(20,26,32,.25);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --paper:#101418; --card:#191f25; --card2:#212832; --ink:#e9ebed; --ink2:#aeb7bf; --ink3:#7d8791;
  --line:#2a323b; --line2:#222a32; --accent:#41b49c; --accent-ink:#06211c; --focus:#41b49c;
  --must:#e8806d; --must-bg:#35211d; --pri:#d7a751; --pri-bg:#302614;
  --field:#7fabd6; --field-bg:#1b2836; --chk:#ad97d3; --chk-bg:#262034;
  --low:#8c959f; --low-bg:#222930; --own:#41b49c; --own-bg:#12302a;
  --hl:#312b16; --hl-line:#4d4222; --s1:#27a68c; --s2:#9471dd; --gridc:#2d353e;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -16px rgba(0,0,0,.7);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#101418; --card:#191f25; --card2:#212832; --ink:#e9ebed; --ink2:#aeb7bf; --ink3:#7d8791;
  --line:#2a323b; --line2:#222a32; --accent:#41b49c; --accent-ink:#06211c; --focus:#41b49c;
  --must:#e8806d; --must-bg:#35211d; --pri:#d7a751; --pri-bg:#302614;
  --field:#7fabd6; --field-bg:#1b2836; --chk:#ad97d3; --chk-bg:#262034;
  --low:#8c959f; --low-bg:#222930; --own:#41b49c; --own-bg:#12302a;
  --hl:#312b16; --hl-line:#4d4222; --s1:#27a68c; --s2:#9471dd; --gridc:#2d353e;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -16px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"IBM Plex Sans KR",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%}
h1,h2,h3{margin:0;text-wrap:balance}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
.mono{font-family:"Archivo",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.lbl{font-family:"Archivo",sans-serif;font-size:10.5px;font-weight:600;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink3)}

/* ---------- top bar ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);
  border-bottom:1px solid var(--line);padding:10px 16px 8px}
.top-row{display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:baseline;gap:7px;min-width:0}
.brand b{font-family:"Archivo",sans-serif;font-weight:700;font-size:15px;letter-spacing:-.01em}
.brand span{font-family:"Archivo",sans-serif;font-size:10px;font-weight:600;letter-spacing:.14em;color:var(--ink3)}
.icon-btn{margin-left:auto;display:grid;place-items:center;width:38px;height:38px;border-radius:10px;
  border:1px solid var(--line);color:var(--ink2);background:var(--card)}
.search{margin-top:9px;display:flex;align-items:center;gap:8px;background:var(--card);
  border:1px solid var(--line);border-radius:11px;padding:0 12px;height:44px}
.search input{flex:1;min-width:0;border:0;background:none;height:100%;outline:none}
.search input::placeholder{color:var(--ink3)}
.search .clr{width:30px;height:30px;border-radius:50%;color:var(--ink3);display:none;place-items:center}
.search.has .clr{display:grid}
.tabs{display:flex;gap:6px;margin:9px -16px 0;padding:0 16px 2px;overflow-x:auto;
  scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;display:flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:999px;
  border:1px solid var(--line);background:var(--card);color:var(--ink2);font-size:13px;font-weight:500;white-space:nowrap}
.tab .n{font-family:"Archivo",sans-serif;font-variant-numeric:tabular-nums;font-size:11.5px;color:var(--ink3)}
.tab[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.tab[aria-selected="true"] .n{color:var(--paper);opacity:.65}
.sub{display:flex;align-items:center;gap:10px;padding:8px 16px 0;flex-wrap:wrap}
.sub .count{font-family:"Archivo",sans-serif;font-size:12px;font-variant-numeric:tabular-nums;color:var(--ink3)}
.sub button{font-size:12.5px;color:var(--accent);font-weight:500;text-decoration:underline;
  text-underline-offset:3px;min-height:32px}

/* ---------- top-level view nav ---------- */
.vnav{display:flex;gap:3px;margin-top:9px;background:var(--card2);border:1px solid var(--line);
  border-radius:11px;padding:3px}
.vnav button{flex:1;min-width:0;height:36px;border-radius:8px;font-size:13px;font-weight:600;
  color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vnav button[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}

/* ---------- shared page blocks (구글문의 / 운영현황) ---------- */
.page{padding:14px 16px calc(env(safe-area-inset-bottom,0px) + 40px);max-width:760px;margin:0 auto}
.page-head{margin-bottom:4px}
.page-head h2{font-size:20px;font-weight:600;letter-spacing:-.015em;line-height:1.3}
.page-head p{margin:6px 0 0;font-size:13px;color:var(--ink2);line-height:1.6}
.notice{margin-top:10px;display:flex;gap:8px;align-items:flex-start;padding:10px 12px;border-radius:10px;
  background:var(--must-bg);color:var(--must);font-size:12.5px;line-height:1.55;font-weight:500}
.notice b{font-weight:700}
.gtitle{display:flex;align-items:baseline;gap:8px;margin:22px 0 8px}
.gtitle .lbl{color:var(--accent)}
.gtitle .gc{font-family:"Archivo",sans-serif;font-size:11px;font-variant-numeric:tabular-nums;color:var(--ink3)}

/* agenda */
.ag{display:grid;gap:8px}
.ag-item{background:var(--card);border:1px solid var(--line2);border-radius:13px;box-shadow:var(--shadow);
  overflow:hidden}
.ag-item[data-on="1"]{border-color:var(--accent)}
.ag-hd{display:grid;grid-template-columns:24px 1fr;gap:10px;align-items:start;width:100%;text-align:left;
  padding:13px 13px 11px}
.ag-hd .box{width:22px;height:22px;border-radius:6px;border:1.5px solid var(--line);display:grid;
  place-items:center;font-size:12px;color:transparent;background:var(--card2);margin-top:1px}
.ag-item[data-on="1"] .box{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.ag-hd .t{font-size:15px;font-weight:600;line-height:1.45}
.ag-item[data-on="1"] .ag-hd .t{color:var(--ink3)}
.ag-b{list-style:none;margin:0;padding:0 13px 13px 47px;display:grid;gap:7px}
.ag-b li{position:relative;font-size:14px;line-height:1.68;color:var(--ink2)}
.ag-b li::before{content:"";position:absolute;left:-13px;top:9px;width:4px;height:4px;border-radius:50%;
  background:var(--line);}

/* ops: tiles */
.tiles{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.tile{background:var(--card);border:1px solid var(--line2);border-radius:13px;padding:12px 13px;
  box-shadow:var(--shadow)}
.tile .tl{display:block;font-size:11.5px;color:var(--ink3);font-weight:500}
.tile .tv{display:block;margin-top:4px;font-family:"Archivo",sans-serif;font-variant-numeric:tabular-nums;
  font-size:21px;font-weight:600;letter-spacing:-.01em;line-height:1.15}
.tile .ts{display:block;margin-top:3px;font-size:11.5px;color:var(--ink3);
  font-variant-numeric:tabular-nums}
.tile.a{border-left:3px solid var(--s1)}
.tile.b{border-left:3px solid var(--s2)}

/* ops: chart */
.chart{background:var(--card);border:1px solid var(--line2);border-radius:13px;padding:13px;
  box-shadow:var(--shadow)}
.chart h3{font-size:14px;font-weight:600;margin-bottom:2px}
.chart .cs{font-size:11.5px;color:var(--ink3);margin-bottom:9px}
.lg{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:6px}
.lg span{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--ink2)}
.lg i{width:9px;height:9px;border-radius:2px;flex:0 0 auto}
.chart svg{display:block;width:100%;height:auto;max-width:100%;overflow:visible}

/* ops: game rows */
.grows{display:grid;gap:5px}
.grow{position:relative;background:var(--card);border:1px solid var(--line2);border-radius:10px;
  padding:9px 11px;overflow:hidden}
.grow .bar{position:absolute;left:0;top:0;bottom:0;opacity:.13;border-radius:0 6px 6px 0}
.grow .gi{position:relative;display:flex;align-items:baseline;gap:8px;justify-content:space-between}
.grow .gn{font-size:13.5px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap}
.grow .gr{font-family:"Archivo",sans-serif;font-variant-numeric:tabular-nums;font-size:13.5px;
  font-weight:600;flex:0 0 auto}
.grow .gm{position:relative;margin-top:3px;display:flex;flex-wrap:wrap;gap:3px 12px;font-size:11.5px;
  color:var(--ink3);font-variant-numeric:tabular-nums}

/* ops: data table */
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--line2);border-radius:13px;
  box-shadow:var(--shadow)}
table.dt2{border-collapse:collapse;width:100%;font-size:12.5px;font-variant-numeric:tabular-nums}
table.dt2 th,table.dt2 td{padding:8px 10px;text-align:right;white-space:nowrap;
  border-bottom:1px solid var(--line2)}
table.dt2 th{font-weight:600;color:var(--ink3);font-size:11px;letter-spacing:.02em}
table.dt2 th:first-child,table.dt2 td:first-child{text-align:left;position:sticky;left:0;
  background:var(--card)}
table.dt2 tr:last-child td{border-bottom:0}
table.dt2 tbody tr:last-child td{font-weight:600}

/* ops: practice cards */
.pc{background:var(--card);border:1px solid var(--line2);border-radius:13px;padding:13px;
  box-shadow:var(--shadow)}
.pc + .pc{margin-top:8px}
.pc-hd{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.pc-hd h3{font-size:14.5px;font-weight:600;line-height:1.4}
.pc.fail{border-color:var(--must);background:var(--must-bg)}
.pc.fail .pill{background:var(--card);color:var(--must)}
.mixbar{display:flex;height:10px;border-radius:5px;overflow:hidden;margin:4px 0 8px;gap:2px}
.mixbar i{display:block}

/* ---------- filter sheet ---------- */
.fs{display:grid;gap:10px;padding:12px 16px 14px;background:var(--card2);border-bottom:1px solid var(--line)}
.fs label{display:grid;gap:5px}
.fs select{height:42px;border:1px solid var(--line);border-radius:10px;background:var(--card);padding:0 10px}
.fs .fs-row{display:grid;gap:10px;grid-template-columns:1fr}
@media(min-width:560px){.fs .fs-row{grid-template-columns:1fr 1fr 1fr}}

/* ---------- list ---------- */
.list{padding:10px 16px 28px;display:grid;gap:7px}
.row{position:relative;display:grid;grid-template-columns:1fr auto;align-items:start;gap:8px;
  width:100%;text-align:left;background:var(--card);border:1px solid var(--line2);border-radius:12px;
  padding:11px 10px 11px 12px;box-shadow:var(--shadow);overflow:hidden}
.row::before{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:var(--low)}
.row[data-p="반드시"]::before{background:var(--must)}
.row[data-p="우선"]::before{background:var(--pri)}
.row[data-p="현장 후보"]::before{background:var(--field)}
.row[data-p="확인 필요"]::before{background:var(--chk)}
.row[data-p="자사"]::before{background:var(--own)}
.row[data-hl="1"]{background:var(--hl);border-color:var(--hl-line)}
.row .mid{display:grid;grid-template-columns:30px 1fr;gap:9px;align-items:start;min-width:0;
  text-align:left;padding:2px 0}
.row .idx{font-family:"Archivo",sans-serif;font-variant-numeric:tabular-nums;font-size:11px;
  font-weight:600;color:var(--ink3);padding-top:3px;display:block}
.row .bd{min-width:0;display:block}
.row .nm{display:block;font-weight:600;font-size:15px;line-height:1.35;letter-spacing:-.005em}
.row .meta{margin-top:3px;font-size:12.5px;color:var(--ink2);display:flex;flex-wrap:wrap;gap:4px 8px}
.row .tt{display:block;margin-top:4px;font-size:12px;color:var(--ink3);overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap}
.row .rt{display:flex;flex-direction:column;align-items:flex-end;gap:5px;padding-top:1px}
.star{width:38px;height:38px;margin:-8px -6px -8px 0;display:grid;place-items:center;
  font-size:17px;color:var(--ink3);line-height:1}
.star[aria-pressed="true"]{color:var(--pri)}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 7px;border-radius:6px;font-size:11px;
  font-weight:600;white-space:nowrap;background:var(--low-bg);color:var(--low)}
.pill.must{background:var(--must-bg);color:var(--must)}
.pill.pri{background:var(--pri-bg);color:var(--pri)}
.pill.field{background:var(--field-bg);color:var(--field)}
.pill.chk{background:var(--chk-bg);color:var(--chk)}
.pill.own{background:var(--own-bg);color:var(--own)}
.pill.deep{background:transparent;color:var(--accent);border:1px solid var(--accent);font-weight:600}
.st{font-size:10.5px;font-weight:600;color:var(--ink3);font-family:"Archivo",sans-serif;letter-spacing:.06em}
.st.done{color:var(--accent)}
.st.hold{color:var(--pri)}
.empty{padding:44px 16px;text-align:center;color:var(--ink3);font-size:14px}

/* ---------- detail ---------- */
.dt{position:fixed;inset:0;z-index:40;background:var(--paper);overflow-y:auto;
  -webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.dt-top{position:sticky;top:0;z-index:2;background:var(--paper);border-bottom:1px solid var(--line);
  padding:calc(env(safe-area-inset-top,0px) + 8px) 16px 8px;display:flex;align-items:center;gap:8px}
.dt-top .back{display:flex;align-items:center;gap:6px;height:38px;padding:0 10px 0 4px;
  font-size:13.5px;font-weight:500;color:var(--ink2)}
.dt-body{padding:14px 16px calc(env(safe-area-inset-bottom,0px) + 96px);max-width:720px;margin:0 auto}
.dt h1{font-size:22px;font-weight:600;letter-spacing:-.015em;line-height:1.28}
.dt .chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.dt .kv{margin-top:12px;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px}
.dt .kv dt{color:var(--ink3)}
.dt .kv dd{margin:0;color:var(--ink2)}
.sec{margin-top:18px;background:var(--card);border:1px solid var(--line2);border-radius:14px;
  padding:14px;box-shadow:var(--shadow)}
.sec > .lbl{display:block;margin-bottom:8px}
.sec p{margin:0;color:var(--ink);font-size:14.5px;line-height:1.72}
.sec p + p{margin-top:8px}
.qs{list-style:none;margin:0;padding:0;display:grid;gap:8px;counter-reset:q}
.q{border:1px solid var(--line2);border-radius:11px;background:var(--card2);overflow:hidden}
.q button.qt{display:grid;grid-template-columns:26px 1fr;gap:9px;width:100%;text-align:left;padding:11px 12px;
  align-items:start}
.q .box{width:22px;height:22px;border-radius:6px;border:1.5px solid var(--line);display:grid;
  place-items:center;font-size:12px;color:transparent;background:var(--card);margin-top:1px}
.q[data-on="1"] .box{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.q[data-on="1"] .qx{color:var(--ink3)}
.q .qtag{display:block;font-family:"Archivo",sans-serif;font-size:10px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;color:var(--accent);margin-bottom:3px}
.q .qx{font-size:14.5px;line-height:1.66;counter-increment:q}
.q .qx::before{content:counter(q) ". ";color:var(--ink3);font-family:"Archivo",sans-serif;font-weight:600}
details.fold{border-top:1px solid var(--line2);margin-top:10px;padding-top:10px}
details.fold summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:6px;
  min-height:32px;font-size:13px;font-weight:500;color:var(--accent)}
details.fold summary::-webkit-details-marker{display:none}
details.fold summary::after{content:"▾";font-size:11px}
details.fold[open] summary::after{content:"▴"}
details.fold p{margin-top:8px;font-size:14px;color:var(--ink2)}
.fl{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.fl li{display:grid;grid-template-columns:30px 1fr;gap:10px;padding:11px 0;align-items:start}
.fl li + li{border-top:1px dashed var(--line)}
.fl .step{font-family:"Archivo",sans-serif;font-variant-numeric:tabular-nums;font-size:11px;
  font-weight:700;letter-spacing:.04em;color:var(--accent);padding-top:3px}
.fl .sl{display:block;font-size:11.5px;font-weight:600;color:var(--ink3);margin-bottom:3px}
.fl .tx{display:block;font-size:14.5px;line-height:1.72}
.fl .cp{margin-top:8px}
.en{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.en li{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:start;padding:10px 11px;
  border:1px solid var(--line2);border-radius:11px;background:var(--card2)}
.en q{font-size:14px;line-height:1.6;quotes:"“" "”";color:var(--ink)}
.cp{flex:0 0 auto;height:32px;padding:0 10px;border:1px solid var(--line);border-radius:8px;
  font-size:11.5px;font-weight:600;color:var(--ink2);background:var(--card);font-family:"Archivo",sans-serif}
.cp.ok{border-color:var(--accent);color:var(--accent)}
textarea.memo{width:100%;min-height:104px;border:1px solid var(--line);border-radius:11px;background:var(--card2);
  padding:11px 12px;resize:vertical;line-height:1.6;outline:none}
textarea.memo:focus{border-color:var(--accent)}
.sts{display:flex;gap:7px;margin-top:10px}
.sts button{flex:1;height:42px;border:1px solid var(--line);border-radius:10px;font-size:13px;font-weight:600;
  color:var(--ink2);background:var(--card)}
.sts button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.dt-bar{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--card);border-top:1px solid var(--line);
  padding:9px 16px calc(env(safe-area-inset-bottom,0px) + 9px);display:flex;gap:8px;align-items:center}
.dt-bar .saved{font-size:11.5px;color:var(--ink3);font-family:"Archivo",sans-serif;letter-spacing:.04em}
.dt-bar .nx{margin-left:auto;height:42px;padding:0 15px;border-radius:10px;background:var(--accent);
  color:var(--accent-ink);font-size:13.5px;font-weight:600}
.dt-bar .st2{height:42px;padding:0 14px;border-radius:10px;border:1px solid var(--line);font-size:13.5px;font-weight:600;color:var(--ink2)}

/* ---------- export sheet ---------- */
.ov{position:fixed;inset:0;z-index:50;background:rgba(10,14,18,.5);display:grid;align-items:end}

어떤 구간을 통과해야 하나요? 최근 6개월 사이 이 기준이 올라간 항목이 있다면 어디인가요?"],["하이브리드 전환","Super Stylist·Phone Case DIY처럼 단순 코어에 메타를 얹을 때, 메타 개발을 시작하는 트리거 지표와 “메타를 붙였는데 실패했다”고 판정하는 지표는 각각 무엇인가요?"],["수익화","IAA로 출발한 타이틀에 IAP를 얹을 때 초기 30일 ARPDAU 구성비를 어디까지 바꾸는 것이 안전하다고 보시나요? 광고 제거(remove ads) 상품은 언제 넣으시나요?"],["UA·크리에이티브","타이틀당 월 몇 편의 크리에이티브를 돌리고, 승자 1편을 찾기까지 평균 몇 편·며칠이 드나요? 승자 크리에이티브에 맞춰 게임 내용을 거꾸로 수정한 사례가 있나요?"],["협업 구조","10년 이상 운영된 퍼즐 IP와 라이브운영 조직을 가진 개발사와 일한다면, CrazyLabs가 맡는 범위(UA·크리에이티브·스토어)와 개발사가 지킬 범위(코어·메타·경제)를 어떻게 나누고 수익배분은 어떤 구조가 일반적인가요?"]],"deep":1},{"n":"2","c":"Easybrain","ct":"키프로스","rg":"유럽","geo":"확인됨","pr":"반드시","cat":"게임사/퍼블리셔","fit":"매우 높음","adv":"높음","why":"25억+ 다운로드의 퍼즐 전문사. Sudoku·Block·Sort·Arrow 등 폭넓은 퍼즐 포트폴리오와 데이터 기반 운영.","note":"사전 예약 우선. 참석자의 제품·사업 책임 범위를 확인하고 구체적인 후속 과제를 합의.","rev":"500억 ~ 1000억","tt":"Sudoku.com, Blockudoku, Nonogram.com, Art Puzzle","lvl":"공개자료·회사 규모 기반 구간 추정","purpose":"광고 중심 퍼즐 포트폴리오를 장기간 운영하는 가드레일을 확보해, 글로벌 퍼즐 플래그십의 수익화 상한선과 성숙 타이틀 방어 전략을 정교화한다. 애니팡의 D30 이후 이벤트 운영 경험과 그들의 광고 최적화 기준을 맞교환하는 실무 대화로 만드는 것이 목표다.","exp":"포트폴리오 전반의 행동 데이터로 퍼즐별 광고 노출·난이도·콘텐츠 공급을 세밀하게 조정한다는 설명이 예상된다. 신작 기준으로는 낮은 진입장벽, 반복 가능한 코어, 광고 수용성, 글로벌 크리에이티브 확장성을 묶어 말할 가능성이 높다. 우리가 가져올 것은 구체적인 상한선 숫자보다 “무엇을 절대 건드리지 않는가”라는 금지 목록과, 장기 지표를 판정하는 실험 기간이다.","how":"상대의 수치를 캐묻는 대화로 만들지 말고, 애니팡의 장기 운영에서 얻은 D30 이후 이벤트 반응 패턴을 먼저 한 가지 공개해 교환 구도를 만든다. 그다음 “올리는 방법”이 아니라 “올리다 실패해서 되돌린 사례”를 물으면 실제 가드레일이 드러난다. 끝에는 퍼즐 장르 신작 판단 기준을 한 문단으로 정리해 달라고 부탁해 기록으로 남긴다.","ask":"광고 수익화 금지 목록(건드리지 않는 항목) / 장기 지표 판정 실험 기간 기준 / 협업 가능 형태에 대한 1차 의견","ice":"Sudoku.com과 Blockudoku를 오랫동안 글로벌 규모로 운영해 온 점이 인상적이라고 언급하고, 이번 행사에서 가장 관심 있게 보는 퍼즐 트렌드를 가볍게 묻는다.","agenda":"장수 퍼즐 포트폴리오 운영, 광고수익화, 신작 발굴 경험을 교류하고, Easybrain의 글로벌 규모와 위메이드플레이의 장기 LiveOps 및 아시아 시장 역량을 결합한 협력 가능성을 논의한다.","en":["On a long-running puzzle title, what ad limits do you never cross - first ad timing, interstitial gap, impressions per session?","How do you catch an ad experiment that holds D7 but quietly damages D30 and D90?","When you look at a new match-3 or merge title, what makes you call it different enough to back?"],"qs":[["수익화 가드레일","Sudoku.com처럼 오래된 퍼즐에서 광고 ARPDAU를 올릴 때 절대 넘지 않는 상한선(세션당 노출 수, 첫 광고 시점, 인터스티셜 최소 간격)은 무엇을 기준으로 정하나요?"],["장기 리텐션","광고 실험이 D7은 멀쩡한데 D30·D90에서만 손해를 보는 경우를 어떻게 잡아내나요? 장기 지표를 확인하기 위해 실험 하나에 최소 몇 주를 쓰시나요?"],["포트폴리오","여러 퍼즐 타이틀 사이에서 UA 학습·세그먼트·크리에이티브는 어떤 단위로 공유하나요? 교차 프로모션이 신작 초기 리텐션을 부풀리는 효과는 어떻게 보정해서 판단하나요?"],["신작 판단","매치3·머지처럼 이미 포화된 장르에서 신작을 검토할 때 “충분히 다르다”고 판단하는 근거는 코어 플레이 패턴인가요, 메타 구조인가요, 크리에이티브 소재인가요?"],["협업 구조","한국에서 10년 넘게 퍼즐을 운영한 팀과 협업한다면 지역 퍼블리싱·공동개발·광고 인벤토리 교환 중 어떤 형태가 현실적이라고 보시나요?"]],"deep":1},{"n":"3","c":"Hitapps","ct":"미국","rg":"북미","geo":"확인됨","pr":"반드시","cat":"게임사/퍼블리셔","fit":"매우 높음","adv":"매우 높음","why":"모바일 퍼즐 전문이며 광고수익과 UA를 함께 최적화한 최신 사례가 명확. 실무 벤치마크 가치가 특히 높음.","note":"사전 예약 권장. 참석자 직급과 담당 장르가 맞지 않으면 현장 네트워킹으로 전환.","rev":"500억 ~ 1000억","tt":"Hexa Sort, Number Match, Merge Miners","lvl":"회사 규모·사업범위 기반 추정(확인 필요)","purpose":"Hexa Sort·Number Match·Merge Miners는 하이브리드캐주얼이 실제로 장기 매출로 전환된 최신 사례다. 코어 1개에서 메타·이벤트·IAP를 단계적으로 붙인 순서와 각 단계의 판단 지표를 확보해, 우리 매치3·머지2의 출시 후 12개월 로드맵을 그들의 실측 순서에 맞춰 재설계한다.","exp":"초기에는 리워드 광고 중심으로 ARPDAU를 확보하고, 리텐션이 확인된 뒤 메타·이벤트·IAP를 붙였다는 시간순 설명이 나올 가능성이 높다. 난이도와 보상 광고의 관계는 “광고를 봐야 깰 수 있는 상태를 만들지 않는다” 수준의 원칙으로 답할 수 있다. 우리가 확보해야 하는 것은 각 단계의 순서와 트리거 지표이며, 절대 수치보다 순서가 훨씬 재사용 가치가 크다.","how":"“최근 2년 사례 중 가장 참고하고 있는 회사”라고 솔직하게 전제하고, 칭찬 대신 타임라인을 요청한다. 화이트보드나 메모에 12개월 타임라인을 직접 그리며 단계마다 “그때 지표가 어땠나요”를 붙여 물으면 구체성이 확보된다. 우리 쪽 매치3·머지2 기획 단계 한 가지를 공개하고 “이 순서가 맞아 보이는지” 역으로 검증받는다.","ask":"출시 후 12개월 확장 타임라인(단계별 트리거 지표) / 보상광고-난이도 균형 원칙 / 프로토타입 리뷰 가능 여부","ice":"Hexa Sort가 이해하기 쉬운 코어에서 글로벌 장기 타이틀로 성장한 점을 언급하고, 성장 과정에서 가장 예상 밖이었던 이용자 반응을 묻는다.","agenda":"광고형 퍼즐 타이틀을 제품·UA 크리에이티브·수익화의 반복 개선으로 확장한 경험을 교류하고, 소프트론칭 벤치마킹과 아시아 시장 운영 협력 가능성을 논의한다.","en":["Can you walk me through the first 12 months of Hexa Sort in order - what you added, and what metric triggered each step?","How did the ARPDAU mix between rewarded, interstitial and IAP change over that time?","After CPI started rising, what kept the scale going - creative, new channels, or LTV work?"],"qs":[["확장 순서","Hexa Sort 출시 후 12개월 동안 추가한 시스템을 순서대로 말해주실 수 있나요? 각 단계를 추가하기로 결정한 지표는 무엇이었나요?"],["수익화 믹스","Hexa Sort의 ARPDAU에서 리워드·인터스티셜·배너·IAP 비중이 시간에 따라 어떻게 바뀌었나요? IAP가 의미 있게 올라오기 시작한 시점은 언제였나요?"],["난이도·경제","광고 보상을 난이도 완화 수단으로 쓰면 결국 퍼즐의 긴장감이 사라집니다. 보상 광고 노출과 난이도 곡선의 균형을 어떤 지표로 관리하나요?"],["UA","Hexa Sort의 CPI가 오르기 시작한 뒤에도 스케일을 유지한 방법은 크리에이티브였나요, 채널 확장이었나요, LTV 개선이었나요? 순서대로 기여도를 말해주실 수 있나요?"],["협업 구조","머지·소트 계열 신작을 공동으로 검증한다면 Hitapps가 가장 빠르게 판단해 줄 수 있는 구간(프로토타입·소프트론치·스케일)은 어디인가요?"]],"deep":1},{"n":"4","c":"HYPERCELL","ct":"라트비아","rg":"유럽","geo":"확인됨","pr":"반드시","cat":"게임사/퍼블리셔","fit":"매우 높음","adv":"높음","why":"Hyper-casual과 Casual을 함께 운영하며 Sand Balls 등 대형 다운로드 경험. 퍼즐·시뮬레이션 hybrid 확장 사례가 풍부.","note":"사전 예약 권장. 참석자 직급과 담당 장르가 맞지 않으면 현장 네트워킹으로 전환.","rev":"500억 ~ 1000억","tt":"Sand Balls, Run Rich 3D, Garden Balls","lvl":"공개자료·회사 규모 기반 구간 추정","purpose":"하이퍼캐주얼 대량 생산 체계를 유지하면서 캐주얼·하이브리드로 무게를 옮긴 조직 구조를 확인한다. 우리가 하이브리드캐주얼 퍼블리싱을 확장할 때 필요한 프로토타입 처리량, 킬 기준, 팀 편성의 현실적인 수치를 얻는 것이 목표다.","exp":"프로토타입 처리량과 빠른 킬 문화, 소수 인원의 짧은 사이클을 강조할 가능성이 높다. 캐주얼 전환에서는 콘텐츠 공급과 라이브운영 인력을 병목으로 지적할 수 있다. 우리가 얻어야 할 것은 “월 몇 개 / 몇 명 / 며칠 / 어느 숫자에서 중단”이라는 운영 단위이며, 이는 우리 퍼블리싱 조직 설계에 바로 대입할 수 있다.","how":"전략 질문보다 운영 단위 질문이 유효한 상대다. 숫자를 물을 때 “대략적인 범위라도 괜찮습니다”라고 먼저 풀어주고, 프로토타입 1개의 인건비·기간을 우리 기준과 비교해 보여주면 상대도 구체적으로 답한다. 마지막에 우리 프로토타입 1종을 그들의 테스트 기준으로 평가받을 수 있는지 물어본다.","ask":"프로토타입 처리량·인력·기간 기준 / 킬 기준 지표 조합 / 한국 개발 프로토타입 테스트 협업 가능성","ice":"Sand Balls 이후 하이퍼캐주얼에서 더 장기적인 게임으로 확장해 온 변화를 언급하고, 현재 가장 가능성이 크다고 보는 하이브리드 장르를 묻는다.","agenda":"하이퍼캐주얼 코어를 지속 가능한 하이브리드캐주얼 제품으로 전환하는 메타·UA·LiveOps 전략을 교류하고, 공동개발 또는 퍼블리싱 가능성을 논의한다.","en":["How many prototypes do you test a month, and how many people and days does one testable build take?","Do you kill on CPI alone or CPI combined with D1, and who decides to give a borderline build a second run?","When you moved a mass-download title into long-term operation, what was the real bottleneck?"],"qs":[["생산 체계","월 몇 개의 프로토타입을 테스트하고, 그중 몇 개가 소프트론치까지 가나요? 프로토타입 1개를 테스트 가능한 상태로 만드는 데 몇 명·며칠이 드나요?"],["킬 기준","테스트를 중단하는 기준을 CPI 단독으로 보시나요, 아니면 CPI×D1 조합으로 보시나요? “애매한” 결과가 나왔을 때 한 번 더 시도하는 판단은 누가 하나요?"],["전환","Sand Balls처럼 대량 다운로드를 확보한 타이틀을 장기 운영형으로 바꿀 때 가장 큰 병목은 콘텐츠 공급이었나요, 경제 설계였나요, 팀 역량이었나요?"],["수익화","하이퍼캐주얼 수준의 광고 노출 밀도를 캐주얼 타이틀에 그대로 적용했을 때 실패한 경험이 있나요? 어느 지표에서 먼저 신호가 왔나요?"],["협업 구조","한국 개발사가 만든 캐주얼·퍼즐 프로토타입을 테스트해 본 경험이 있나요? 지역 차이 때문에 지표 해석이 달라진 사례가 있었나요?"]],"deep":1},{"n":"5","c":"InMobi","ct":"싱가포르","rg":"동남아시아","geo":"확인됨","pr":"반드시","cat":"애드테크/광고수요","fit":"낮음","adv":"매우 높음","why":"AdMob·GAM·MAX·LevelPlay와 연동 가능한 글로벌 demand source/mediation. 비미국 지역 incremental demand 확인 가치.","note":"시간표와 참석자 직무를 확인해 현장 미팅 여부 결정. 내부 KPI의 정확한 수치보다 의사결정 방식 질문.","rev":"5000억 이상","tt":"InMobi Exchange, InMobi DSP, InMobi Audiences","lvl":"공개자료·회사 규모 기반 구간 추정","purpose":"애니팡 계열과 글로벌 플래그십에서 InMobi 수요가 Google 중심 구조에 실제 순증(incremental) 매출을 만드는지 검증한다. 미팅 결과물은 “한국 캐주얼 트래픽”과 “글로벌 소프트론치” 두 케이스로 나눈 6~8주 제한 테스트 설계서와 성공 기준이다.","exp":"비미국 시장의 직접 광고주 수요와 오디언스 데이터로 fill·eCPM 개선을 강조할 가능성이 높다. 순증은 동일 지역·이용자를 나눈 홀드아웃이나 비딩 비교로 검증하자고 제안할 수 있다. 주의할 점은 “평균 uplift” 수치를 받아오는 것은 의미가 없다는 것이다. 우리가 확인할 것은 테스트 설계, 최소 트래픽, 판정 기간, 그리고 실패 시 롤백 조건이다.","how":"현재 미디에이션 구조와 주요 국가·포맷 비중을 범위 수준으로 먼저 공개해 상대가 추정으로 답하지 않게 만든다. 평균 성과를 묻는 질문은 피하고, 두 케이스(한국 캐주얼 / 글로벌 소프트론치)로 나눠 각각의 테스트 셀과 종료 기준을 요구한다. 내부 KPI 수치보다 의사결정 방식과 문서화 수준을 확인하는 것이 이 미팅의 핵심이다.","ask":"2개 케이스별 6~8주 테스트 설계서 / 한국 시장 차단 카테고리 관리 방식 / 기술 연동 담당자 연결","ice":"","agenda":"","en":["Where does your demand genuinely not overlap with Google's on Korean and Japanese casual puzzle traffic - which advertisers and formats?","What holdout design and minimum traffic do we need to prove incremental lift, and over how many days?","Can you put a six to eight week test plan in writing, with the success and rollback criteria agreed up front?"],"qs":[["수요 강점","한국·일본과 미국의 캐주얼 퍼즐 트래픽에서 InMobi가 Google 수요와 중복되지 않는 광고주군·포맷·시간대는 구체적으로 어디인가요?"],["순증 검증","기존 AdMob 미디에이션에 InMobi를 추가할 때 순증 효과를 증명하려면 어떤 홀드아웃 설계와 최소 트래픽 규모가 필요한가요? 며칠이면 통계적으로 판단 가능한가요?"],["광고 품질","10년 이상 유지되는 이용자층이 있는 게임에서 광고 피로와 이탈을 막기 위해 제공하는 품질·빈도·민감 카테고리 차단 도구는 무엇인가요? 한국 기준 차단 목록 관리가 가능한가요?"],["가격·정산","가격 하한(price floor)은 우리가 직접 조정할 수 있나요? 리포팅 지연과 정산 주기, 분쟁 시 데이터 근거는 어떻게 제공되나요?"],["협업 구조","글로벌 매치3·머지2 소프트론치에서 리워드와 인터스티셜 수요를 국가별로 검증하는 6~8주 테스트를 제안해 주실 수 있나요? 성공·실패 기준을 먼저 문서로 합의할 수 있나요?"]],"deep":1},{"n":"6","c":"Kwalee","ct":"영국","rg":"유럽","geo":"확인됨","pr":"우선","cat":"게임사/퍼블리셔","fit":"매우 높음","adv":"매우 높음","why":"공식적으로 Hyper Casual, Hybrid Casual, Casual을 모두 개발·퍼블리싱. 전환 전략과 UA economics 학습에 적합.","note":"사전 예약 권장. 참석자 직급과 담당 장르가 맞지 않으면 현장 네트워킹으로 전환.","rev":"1000억 ~ 5000억","tt":"Draw It, Teacher Simulator, Airport Security","lvl":"공개자료·회사 규모 기반 구간 추정","purpose":"하이퍼캐주얼·하이브리드캐주얼·캐주얼을 동시에 운영하는 회사가 장르별로 다른 게이트를 어떻게 관리하는지 확인한다. 우리가 하이브리드캐주얼 퍼블리싱과 글로벌 플래그십을 동시에 진행할 때 필요한 판단 기준 분리 방식을 가져오는 것이 목표다.","exp":"장르별로 다른 기준을 쓰고 있다는 설명과, 탈락 이유로 “코어의 반복성 부족”이나 “크리에이티브가 안 나오는 게임”을 들 가능성이 높다. 페이백 기간은 최근 길어지는 추세를 인정하는 답이 예상된다. 우리가 확인할 것은 내부·외부 프로젝트 간 UA 예산 배분 원칙이며, 이는 퍼블리싱 파트너로서의 실제 우선순위를 보여주는 신호다.","how":"Kwalee는 퍼블리싱 문의를 많이 받는 회사이므로, 게임을 들고 온 개발사 포지션보다 “같은 문제를 푸는 회사”로 대화를 시작하는 것이 유리하다. 우리 하이브리드캐주얼 퍼블리싱 경험에서 실패한 케이스 하나를 먼저 공개하면 상대의 답이 훨씬 구체적으로 돌아온다. 마지막에 외부 개발사 평가 체크리스트를 공유해 달라고 요청한다.","ask":"장르별 성공 기준 차이 요약 / 외부 개발사 탈락 사유 상위 3개 / 페이백 목표 기간 현황","ice":"","agenda":"","en":["Do you run different success gates for hypercasual, hybrid casual and casual? Has the same prototype ever been judged differently depending on how it was classified?","When you reject an external studio's game, what is the most common reason - and why did you pass on builds whose numbers looked fine?","What payback window are you underwriting hybrid casual UA against today, and has it lengthened?"],"qs":[["게이트 분리","하이퍼·하이브리드·캐주얼 각각에 다른 성공 기준을 쓰고 계신가요? 같은 프로토타입이 장르 분류에 따라 다르게 판정된 사례가 있나요?"],["퍼블리싱 기준","외부 개발사 게임을 받을 때 가장 자주 탈락하는 이유는 무엇인가요? 지표는 좋은데 거절한 경우의 이유는 주로 무엇이었나요?"],["UA 경제성","하이브리드캐주얼에서 페이백(payback) 기간을 며칠로 잡고 계신가요? 최근 2년간 이 목표가 길어졌나요, 짧아졌나요?"],["조직","퍼블리싱과 자체 개발을 함께 하면 내부 프로젝트와 외부 프로젝트가 UA 예산을 두고 경쟁합니다. 이 배분은 어떤 원칙으로 정하시나요?"],["협업 구조","한국 퍼즐 IP를 글로벌에 내보낼 때 Kwalee가 기여할 수 있는 부분은 UA인가요, 스토어·플랫폼 관계인가요, 제품 컨설팅인가요?"]],"deep":1},{"n":"7","c":"Paxie Games","ct":"튀르키예","rg":"유럽·중동","geo":"확인됨","pr":"반드시","cat":"게임사/퍼블리셔","fit":"매우 높음","adv":"높음","why":"Merge Studio를 보유한 캐주얼·하이브리드캐주얼 회사. 머지 장르의 장기 리텐션·메타·LiveOps 학습가치가 매우 큼.","note":"사전 예약 우선. 참석자의 제품·사업 책임 범위를 확인하고 구체적인 후속 과제를 합의.","rev":"500억 ~ 1000억","tt":"Merge Studio, Tile Star","lvl":"공개자료·회사 규모 기반 구간 추정","purpose":"Merge Studio·Tile Star를 운영하는 팀에게서 머지2 장르의 경제 설계와 장기 리텐션 노하우를 직접 확보한다. 우리 머지2 플래그십의 보드 경제(생성기·에너지·아이템 체인)와 이벤트 주기를 설계 단계에서 검증받는 것이 목표이며, 이 미팅은 명단 중 머지 장르 학습 가치가 가장 큰 자리다.","exp":"에너지와 생성기 균형을 “세션 길이와 다음 목표까지의 거리”로 관리한다는 설명이 예상되고, 광고 보상은 시간 단축에는 쓰되 진행 자체를 사게 만들지는 않는다는 원칙을 들 가능성이 높다. 이벤트는 템플릿 비중이 높다는 답이 나올 것이다. 우리가 확보할 것은 체인 길이 조정 사례와 이벤트 제작 리소스 단위이며, 둘 다 우리 머지2 사전 설계에 바로 반영할 수 있다.","how":"머지 장르는 설계 디테일이 성패를 가르므로, 큰 질문보다 보드 위에서 벌어지는 구체적 상황을 예로 들어 묻는다. 예를 들어 “중반 체인에서 생성기 2개가 동시에 막히는 상황을 어떻게 처리하시나요” 같은 질문이 훨씬 좋은 답을 끌어낸다. 우리 머지2 설계 문서의 경제 구조 1장을 준비해 가서 즉석 리뷰를 요청하는 것이 이 미팅의 최대 수익이다.","ask":"머지2 보드 경제 리뷰 코멘트 / 이벤트 제작 리소스 단위 / 후속 기술·기획 실무자 채널","ice":"Merge Studio의 글로벌 성장과 튀르키예 게임 생태계의 활력을 언급하고, 머지 장르에서 최근 가장 크게 변한 이용자 기대를 묻는다.","agenda":"머지 게임의 경제 설계, 장기 리텐션, 수익화, LiveOps 경험을 공유하고, Paxie의 머지 전문성과 위메이드플레이의 퍼즐 운영 및 아시아 시장 역량을 결합할 협력 가능성을 논의한다.","en":["How do you balance generator output against energy regeneration, and how do you detect when players start feeling there is nothing to do?","In the mid game, when item chains get long, have you ever shortened a chain or changed the goal structure to hold D30?","Which resources can rewarded ads unlock in a merge economy, and which ones do you never let ads touch?"],"qs":[["보드 경제","머지 게임에서 생성기(generator) 산출량과 에너지 회복 속도의 균형을 어떤 지표로 관리하나요? 이용자가 “할 일이 없다”고 느끼기 시작하는 구간을 어떻게 탐지하나요?"],["장기 리텐션","머지2는 중반 이후 아이템 체인이 길어져 진행이 느려집니다. D30 이후 이탈을 막기 위해 체인 길이나 목표 구조를 조정한 사례가 있나요?"],["수익화","머지 장르에서 리워드 광고가 경제에 미치는 영향이 매치3보다 큽니다. 광고 보상으로 풀 수 있는 자원과 절대 풀지 않는 자원을 어떻게 구분하시나요?"],["이벤트 운영","이벤트 주기를 며칠 단위로 돌리고, 한 사이클에 필요한 제작 리소스는 어느 정도인가요? 템플릿화한 이벤트와 신규 제작 이벤트의 비율은 어떻게 되나요?"],["협업 구조","튀르키예 개발 인력과 한국 라이브운영 조직이 협업한다면 시차와 언어를 감안했을 때 어떤 분업이 현실적이라고 보시나요?"]],"deep":1},{"n":"8","c":"PlaySimple Games Limited","ct":"인도","rg":"남아시아","geo":"확인됨","pr":"반드시","cat":"게임사","fit":"높음","adv":"높음","why":"30개+ 라이브 타이틀을 운용하는 글로벌 casual puzzle/word 포트폴리오 회사. 다작·장수 운영 구조가 유용.","note":"사전 예약 우선. 참석자의 제품·사업 책임 범위를 확인하고 구체적인 후속 과제를 합의.","rev":"500억 ~ 1000억","tt":"Word Trip, Crossword Jam, Daily Themed Crossword","lvl":"공개자료·회사 규모 기반 구간 추정","purpose":"30개 이상의 라이브 타이틀을 동시에 운영하는 회사의 플랫폼화 수준을 확인한다. 애니팡 시리즈를 다작 포트폴리오로 확장할 때 필요한 공통 기술·운영 자산의 범위와, 그것을 만들지 않았을 때 생기는 비용을 파악하는 것이 목표다.","exp":"이벤트 엔진, 실험 플랫폼, 리포팅을 공통 자산으로 쓰고 콘텐츠 생성은 상당 부분 자동화했다는 답이 예상된다. 구독은 워드 장르에서 의미 있는 비중을 차지한다고 말할 가능성이 있다. 우리가 확인할 것은 “타이틀당 운영 인원”과 “공통화 실패 사례”다. 후자는 플랫폼 투자 과잉을 피하는 데 직접 쓰인다.","how":"다작 운영은 애니팡 시리즈 확장과 직접 비교되는 주제이므로, 우리 쪽 타이틀 수와 운영 인원을 먼저 밝히고 벤치마크를 요청하는 형태가 자연스럽다. 자동화 이야기가 나오면 “사람이 반드시 보는 구간”을 되물어 품질 기준을 확인한다. 구독 모델은 애니팡 계열에 적용 가능성이 있으므로 별도로 시간을 배분한다.","ask":"타이틀당 운영 인원 벤치마크 / 공통 플랫폼 구성 요소 목록 / 구독 상품 설계 참고 사례","ice":"30개 이상의 타이틀을 글로벌로 운영하는 규모가 인상적이라고 언급하고, 많은 게임을 운영하면서 가장 표준화하기 어려웠던 부분을 묻는다.","agenda":"공통 데이터·LiveOps·콘텐츠 시스템을 활용한 다수 캐주얼 타이틀의 운영 확장 방식을 교류하고, 아시아 현지화와 포트폴리오 확대 협력 가능성을 논의한다.","en":["Across 30+ live titles, which systems are shared internally - and is there anything you regret making shared?","How many live ops people does one title need, and how many titles can a single team realistically carry?","For short-session word games, how did you grow ads and IAP at the same time, and how much does subscription contribute?"],"qs":[["플랫폼화","30개 이상 타이틀에서 공통으로 쓰는 내부 시스템은 무엇인가요(이벤트 엔진·A/B·광고 제어·리포팅)? 공통화하지 말았어야 했던 것도 있었나요?"],["운영 인력","타이틀당 라이브운영 인원은 평균 몇 명인가요? 몇 개 타이틀까지는 한 팀이 겸임 가능하다고 보시나요?"],["장수 타이틀","워드 게임은 콘텐츠 소모가 빠릅니다. 일일 콘텐츠 공급을 자동화한 범위와 사람이 반드시 검수하는 범위를 어떻게 나누시나요?"],["수익화","워드·크로스워드처럼 세션이 짧은 장르에서 광고와 IAP를 함께 성장시킨 방법은 무엇인가요? 구독 상품의 기여도는 어느 정도인가요?"],["지역 확장","인도 개발 조직으로 북미·유럽 이용자를 운영할 때 문화적 콘텐츠(단어·퀴즈·테마) 품질은 어떻게 확보하나요? 한국·일본 시장은 어떻게 접근하셨나요?"]],"deep":1},{"n":"9","c":"Unity","ct":"미국","rg":"북미","geo":"확인됨","pr":"반드시","cat":"애드테크/게임 플랫폼","fit":"중간","adv":"매우 높음","why":"명단 내 핵심 광고수익화 플랫폼. Unity LevelPlay를 통해 bidding·mediation·rewarded/interstitial 운용 논의 가능.","note":"시간표와 참석자 직무를 확인해 현장 미팅 여부 결정. 내부 KPI의 정확한 수치보다 의사결정 방식 질문.","rev":"5000억 이상","tt":"Unity Engine, Unity Ads, LevelPlay","lvl":"공개자료·회사 규모 기반 구간 추정","purpose":"LevelPlay·Unity Ads가 우리 미디에이션 구조에서 차지할 위치를 결정한다. 애니팡 계열(안정적 국내 트래픽)과 글로벌 플래그십(신규·확장 트래픽)은 요구가 다르므로, 두 트랙을 나눠 마이그레이션 비용과 기대 효과를 구체적으로 확인하는 것이 목표다.","exp":"비딩 도입과 자사 수요·AI 입찰 제품의 성과 개선을 강조할 가능성이 높고, 마이그레이션 비용은 “생각보다 작다”는 방향으로 답할 것이다. 데이터 활용 범위와 이해상충 질문에는 정책 문서를 근거로 답할 가능성이 크다. 우리가 확보할 것은 마이그레이션 절차 문서와 데이터 사용 범위의 계약적 한계이며, 엔진·런타임 정책은 장기 운영 리스크로 따로 기록한다.","how":"플랫폼 상대 미팅에서는 성과 주장보다 절차와 계약 조건을 확인하는 것이 실익이 크다. 현재 구조를 범위 수준으로 공개하고, 두 트랙(애니팡 계열 / 글로벌 신작)에 각각 다른 제안을 요청한다. 엔진 정책 질문은 수익화 담당자가 답할 수 없는 경우가 많으므로, 답변 가능한 담당자 연결을 요청하는 것으로 마무리한다.","ask":"미디에이션 마이그레이션 절차·기간 문서 / 데이터 사용 범위 정책 / 엔진·런타임 정책 담당자 연결","ice":"개발 엔진과 광고수익화 양쪽에서 Unity가 게임사의 의사결정에 관여하는 점을 언급하고, 최근 캐주얼 게임사들이 가장 많이 고민하는 주제를 묻는다.","agenda":"2027년 글로벌 소프트론칭에 적합한 확장성 있는 기술·수익화 구조를 중심으로 미디에이션·비딩, SDK 성능, 실험 체계와 Unity의 제품 지원 가능성을 논의한다.","en":["What does migrating from an AdMob-led setup to LevelPlay actually cost us in work, and how do you avoid a revenue gap during the switch?","In bidding, which countries does Unity demand genuinely win casual puzzle inventory, and how much does it overlap with Google in Korea and Japan?","Can we contractually limit how our monetization data is used in your UA bidding?"],"qs":[["미디에이션 전환","AdMob 중심 구조에서 LevelPlay로 전환하거나 병행할 때 실제 작업량(SDK·워터폴·리포팅 재구축)은 어느 정도인가요? 전환 중 매출 공백을 줄이는 표준 절차가 있나요?"],["비딩·수요","비딩 환경에서 Unity 수요가 캐주얼 퍼즐 인벤토리에 강한 국가는 어디인가요? 한국·일본 트래픽에서 Google 수요와의 중복 정도는 어떻게 보시나요?"],["입찰 모델","AI 기반 입찰·타겟팅 제품군이 개발사 쪽 데이터를 어떻게 활용하나요? 우리가 제공하는 데이터와 그 대가로 얻는 성과 개선을 분리해서 설명해 주실 수 있나요?"],["UA 연동","같은 회사에서 광고 수익화와 UA를 함께 쓸 때 이해상충은 없나요? 우리 게임의 수익화 데이터가 UA 입찰에 쓰이는 범위를 계약으로 제한할 수 있나요?"],["엔진 연계","Unity 엔진 버전 정책과 런타임 요금 구조가 장기 라이브 타이틀에 주는 영향은 무엇인가요? 10년 운영 중인 타이틀의 엔진 업그레이드 지원은 어떻게 제공되나요?"]],"deep":1},{"n":"10","c":"Voodoo","ct":"프랑스","rg":"유럽","geo":"확인됨","pr":"반드시","cat":"게임사/퍼블리셔","fit":"매우 높음","adv":"매우 높음","why":"하이퍼캐주얼에서 하이브리드·캐주얼로 전환한 대표 사례. 장수 IP·퍼즐·IAA/IAP 혼합 전환을 직접 벤치마크.","note":"사전 예약 우선. 참석자의 제품·사업 책임 범위를 확인하고 구체적인 후속 과제를 합의.","rev":"5000억 이상","tt":"Mob Control, Block Jam 3D, Hole.io, Helix Jump","lvl":"공개자료·회사 규모 기반 구간 추정","purpose":"하이퍼캐주얼에서 하이브리드·캐주얼로 무게를 옮긴 가장 큰 사례에서, 전환의 순서와 조직 비용을 확인한다. 우리 하이브리드캐주얼 퍼블리싱 확장과 플래그십 개발을 동시에 진행할 때의 자원 배분 판단에 직접 쓰는 것이 목표다.","exp":"전환의 어려움을 인정하면서 인재 구성과 제품 기준을 함께 바꿨다는 설명이 예상된다. 승격 기준으로는 D7·D30 리텐션과 ARPDAU의 조합, 그리고 “콘텐츠를 계속 만들 수 있는 구조인가”를 들 가능성이 높다. 우리가 확보할 것은 승격·유지·종료의 3단 분류 기준이며, 이는 퍼블리싱 포트폴리오 관리 규칙으로 그대로 쓸 수 있다.","how":"대형사 미팅이므로 시간이 짧다고 가정하고, 질문 3개로 압축할 준비를 한다. 첫 질문은 반드시 “순서를 다시 정한다면”으로 시작해 회고를 유도한다. 우리 쪽에서는 애니팡의 장기 운영 지표 중 하나를 교환 재료로 제시하고, 협업 가능성 질문은 명확한 제안(공동 소프트론치 또는 지역 퍼블리싱) 형태로 던진다.","ask":"승격·유지·종료 3단 분류 기준 / 아시아 스튜디오 협업 조건 / 후속 미팅 채널","ice":"Mob Control과 Block Jam 3D를 통해 하이퍼캐주얼에서 하이브리드·캐주얼로 전환한 과정이 인상적이라고 언급하고, 가장 어려웠던 조직적 변화를 묻는다.","agenda":"하이퍼캐주얼에서 하이브리드·캐주얼로 전환한 경험과 타이틀 확장, UA, IAA·IAP 균형 전략을 교류하고, 아시아 및 글로벌 시장에서의 퍼블리싱·투자·전략적 협력 가능성을 논의한다.","en":["When you shifted to hybrid, what did you change first - hiring, the game bar, or the UA model? What would you change first if you did it again?","How do you decide which titles get promoted to long-term operation, and what state are the maintain-only titles in?","Do you segment ad exposure by payer status, and what did removing ads for payers actually do to revenue?"],"qs":[["전환 순서","하이브리드로 방향을 바꿀 때 먼저 바꾼 것은 채용이었나요, 게임 기준이었나요, UA 모델이었나요? 순서를 다시 정할 수 있다면 무엇을 먼저 하시겠습니까?"],["포트폴리오 판단","Mob Control·Block Jam처럼 장기 운영 대상으로 승격하는 타이틀을 고르는 기준은 무엇인가요? 승격하지 않고 유지만 하는 타이틀은 어떤 상태인가요?"],["수익화","IAA 중심 포트폴리오에 IAP를 붙일 때 이용자 세그먼트별로 광고 노출을 다르게 하시나요? 결제 이용자에게 광고를 줄이는 정책의 실제 손익은 어떻게 나왔나요?"],["크리에이티브","대량 크리에이티브 생산 체계에서 생성형 도구가 실제로 대체한 작업과 대체하지 못한 작업은 무엇인가요? 성과 차이는 어느 정도인가요?"],["협업 구조","한국 개발사와 협업하거나 지분·판권 형태로 투자한 사례가 있나요? 아시아 개발 스튜디오를 볼 때 가장 중요하게 보는 조건은 무엇인가요?"]],"deep":1},{"n":"11","c":"ABI GAME STUDIO","ct":"베트남","rg":"동남아시아","geo":"확인됨","pr":"반드시","cat":"게임사/퍼블리셔","fit":"높음","adv":"높음","why":"다작형 모바일 게임 스튜디오/퍼블리셔로 IAA 기반 글로벌 운영과 빠른 출시체계 비교에 유용.","note":"시간표와 참석자 직무를 확인해 현장 미팅 여부 결정. 내부 KPI의 정확한 수치보다 의사결정 방식 질문.","rev":"500억 ~ 1000억","tt":"Galaxy Attack: Alien Shooter, 1945 Air Force","lvl":"회사 규모·사업범위 기반 추정(확인 필요)","purpose":"Galaxy Attack·1945 Air Force처럼 수년간 IAA 매출을 유지하는 롱테일 운영 방식을 확인한다. 애니팡 구작의 수명 연장과, 하이브리드캐주얼 포트폴리오의 저비용 유지 전략에 쓸 수 있는 운영 규칙을 확보하는 것이 목표다.","exp":"자동화된 이벤트 반복과 최소 인력 유지로 롱테일을 관리한다는 답이 예상된다. 광고 노출 확대는 단기적으로 효과가 있으나 장기 이탈로 돌아온 경험을 언급할 가능성이 있다. 우리가 얻어야 할 것은 구작 유지에 필요한 최소 운영 단위(인력·주기·비용)이며, 이는 애니팡 구작 정책 판단에 바로 대입할 수 있다.","how":"규모보다 효율이 강점인 회사이므로, 전략 논의보다 “지금도 하고 있는 일”과 “멈춘 일”의 목록을 얻는 데 집중한다. 숫자를 물을 때 인력·기간 단위로 물으면 답이 잘 나온다. 한국 퍼블리셔와의 마찰 경험은 향후 협업 설계에 유용하므로 방어적으로 들리지 않게 마지막에 배치한다.","ask":"구작 유지 최소 운영 단위 / 멈춘 작업 목록 / 협업 시 마찰 요인 정리","ice":"Galaxy Attack과 1945 Air Force가 아시아 개발사로서 글로벌 이용자를 확보한 사례임을 언급하고, 베트남 게임 생태계의 최근 변화를 묻는다.","agenda":"빠른 글로벌 출시, IAA 중심 수익화, 포트폴리오 운영 경험을 교류하고, 베트남·한국 및 아시아 시장을 연결하는 공동개발·교차 퍼블리싱 가능성을 논의한다.","en":["For a title five years past launch, what work do you still do every month, and what did you stop entirely?","How many people and days does one content update take, and when did cutting updates actually show up in revenue?","On mature titles, how does UA for reinstalls and returning players compare with new user campaigns?"],"qs":[["롱테일 유지","출시 5년 이상 된 타이틀의 매출을 유지하기 위해 지금도 계속하는 작업은 무엇인가요? 반대로 완전히 멈춘 작업은 무엇인가요?"],["콘텐츠 비용","콘텐츠 업데이트 1회당 투입 인력과 기간은 어느 정도인가요? 업데이트를 줄였을 때 매출이 실제로 떨어지는 시점은 언제였나요?"],["수익화","구작에서 광고 노출을 늘리는 것과 이벤트를 추가하는 것 중 어느 쪽이 더 안전하게 매출을 올렸나요? 판단 근거가 된 지표는 무엇인가요?"],["UA","성숙 타이틀에 UA를 계속 집행하시나요? 재설치·복귀 이용자를 대상으로 한 캠페인의 효율은 신규 대비 어떤가요?"],["협업 구조","베트남 개발 조직의 강점을 외부 파트너와 결합한 사례가 있나요? 한국 퍼블리셔와 일한 경험이 있다면 가장 큰 마찰은 무엇이었나요?"]],"deep":1},{"n":"12","c":"Amobear","ct":"베트남","rg":"동남아시아","geo":"확인됨","pr":"반드시","cat":"게임사/퍼블리셔","fit":"높음","adv":"높음","why":"sort/jam/puzzle 등 최신 hybrid-casual 문법의 빠른 프로토타이핑·출시를 벤치마크하기 좋음.","note":"시간표와 참석자 직무를 확인해 현장 미팅 여부 결정. 내부 KPI의 정확한 수치보다 의사결정 방식 질문.","rev":"500억 ~ 1000억","tt":"Sort·Jam·Puzzle 모바일 게임 포트폴리오","lvl":"회사 규모·사업범위 기반 추정(확인 필요)","purpose":"sort·jam 계열 최신 하이브리드캐주얼 문법을 빠르게 복제·검증하는 체계를 확인한다. 우리 퍼블리싱 라인업의 프로토타입 소싱 속도를 높이고, 트렌드 진입 시점 판단 기준을 확보하는 것이 목표다.","exp":"스토어 순위와 광고 크리에이티브 모니터링으로 트렌드를 감지하고, 짧은 사이클로 테스트한다는 답이 예상된다. 후발 진입의 승산은 CPI와 크리에이티브 가능성으로 판단한다고 말할 가능성이 높다. 우리가 확인할 것은 감지-빌드-테스트의 실제 소요 일수이며, 우리 내부 프로세스와의 격차를 수치로 비교한다.","how":"실무형 스튜디오이므로 구체적인 숫자와 절차를 물으면 잘 답한다. 우리 쪽 프로토타입 제작 기간을 먼저 밝히고 비교를 요청하면 대화가 빠르게 실무로 내려간다. 상호 퍼블리싱 가능성은 명확한 지역 분담 제안으로 던지는 것이 효과적이다.","ask":"트렌드 감지→테스트 소요 일수 / 후발 진입 판단 기준 / 상호 퍼블리싱 관심 여부","ice":"Sort·Jam·Puzzle 장르를 빠르게 확장하는 실행력이 인상적이라고 언급하고, 현재 가장 경쟁이 치열하다고 느끼는 퍼즐 하위 장르를 묻는다.","agenda":"Sort·Jam 게임의 빠른 콘셉트 검증, 광고수익화, 장기 운영형 제품으로의 확장 경험을 교류하고, 아시아 지역 공동개발 또는 하이브리드 퍼블리싱 가능성을 논의한다.","en":["How do you spot a new puzzle format taking off, and how many days until your first test build?","When a format already has a clear number one, how do you judge whether it is still worth entering?","Would you be interested in a partner handling publishing outside Asia, or help entering Korea?"],"qs":[["트렌드 진입","새로운 퍼즐 문법이 뜨는 것을 무엇으로 감지하나요? 감지 후 첫 테스트 빌드가 나오기까지 며칠이 걸리나요?"],["복제와 차별","이미 1위가 있는 문법에 후발로 들어갈 때 승산을 판단하는 기준은 무엇인가요? 차별화는 주로 어디에서 만드시나요(난이도·비주얼·메타·광고 구조)?"],["수익화","sort·jam 계열은 세션이 짧습니다. 짧은 세션에서 ARPDAU를 확보하는 광고 배치 원칙은 무엇인가요?"],["생산 체계","한 타이틀을 유지하는 최소 인력과, 동시에 운영 가능한 타이틀 수는 어떻게 관리하나요?"],["협업 구조","한국 퍼블리셔가 아시아 외 지역 퍼블리싱을 맡는 구조에 관심이 있나요? 반대로 한국 시장 진입을 도와줄 파트너를 찾고 있나요?"]],"deep":1},{"n":"13","c":"Bravestars","ct":"베트남","rg":"동남아시아","geo":"확인됨","pr":"반드시","cat":"게임사/퍼블리셔","fit":"높음","adv":"높음","why":"하이퍼캐주얼→하이브리드캐주얼 전환 경험이 풍부한 베트남계 개발/퍼블리셔. 생산속도와 UA 실험 벤치마크.","note":"시간표와 참석자 직무를 확인해 현장 미팅 여부 결정. 내부 KPI의 정확한 수치보다 의사결정 방식 질문.","rev":"500억 ~ 1000억","tt":"Goods Sort 3D, Screw Puzzle, Save the Doge","lvl":"회사 규모·사업범위 기반 추정(확인 필요)","purpose":"Goods Sort 3D·Screw Puzzle로 하이퍼→하이브리드 전환을 실제로 통과한 스튜디오의 판단 기준을 확인한다. 우리 퍼블리싱 라인업에서 “이 게임에 메타를 붙일 가치가 있는가”를 판정하는 규칙을 만드는 것이 목표다.","exp":"D1·플레이타임이 기준을 넘은 뒤 메타를 붙였고, 광고 시청 상한은 두고 있다는 답이 예상된다. UA 실험은 소수 집중이 낫다는 경험을 이야기할 가능성이 높다. 우리가 확보할 것은 “메타 투자 판정 지표”와 “광고 상한 해제 시 먼저 나빠지는 지표”이며, 두 가지 모두 퍼블리싱 세팅 가이드에 바로 반영할 수 있다.","how":"개발사 관점의 솔직한 답이 나오는 상대이므로, 퍼블리셔 시각의 질문(무엇이 필요한가)을 반드시 포함한다. 우리가 제공할 수 있는 것(한국·일본 시장 운영, LiveOps 설계)을 먼저 구체적으로 제시하면 협업 논의가 실제로 이어진다.","ask":"메타 투자 판정 지표 / 광고 상한 정책 / 퍼블리싱 협업 필요 항목 우선순위","ice":"Goods Sort 3D와 Screw Puzzle처럼 서로 다른 퍼즐 콘셉트를 빠르게 시장에 내놓는 점을 언급하고, 아이디어를 고르는 과정의 재미있는 사례를 묻는다.","agenda":"퍼즐 콘셉트의 빠른 검증, 크리에이티브 제작, UA·수익화 경험을 교류하고, 한국·일본·범중화권 시장의 공동 퍼블리싱과 시장 확장 가능성을 논의한다.","en":["What metrics made you decide to add meta and an economy to Goods Sort 3D, and how did those titles differ from the ones you left alone?","Sort and screw games drop hard after D7 - what change moved that the most?","Do you cap rewarded ad views, and which metric degraded first when you lifted the cap?"],"qs":[["전환 판정","Goods Sort 3D에 메타·경제를 붙이기로 결정한 시점의 지표는 무엇이었나요? 붙이지 않고 그대로 유지한 타이틀과의 차이는 어디에 있었나요?"],["리텐션","소트·스크류 계열은 D1은 높지만 D7 이후가 급격히 떨어지는 경우가 많습니다. 이 구간을 개선한 가장 효과적인 변경은 무엇이었나요?"],["수익화","리워드 광고를 진행 완화에 쓰는 구조에서 광고 시청 횟수 상한을 두시나요? 상한을 없앴을 때 어떤 지표가 먼저 나빠졌나요?"],["UA 실험","한 타이틀에서 동시에 돌리는 UA 실험 수와 실험 판정 기간은 어떻게 관리하나요? 실험 수를 늘렸을 때 학습 품질이 떨어진 경험이 있나요?"],["협업 구조","퍼블리셔와 일할 때 개발사 입장에서 가장 필요한 지원은 UA 자금인가요, 수익화 세팅인가요, 스토어 피처링인가요?"]],"deep":1},{"n":"14","c":"Cas.ai","ct":"벨리즈(법인) / 키프로스(본사 표기)","rg":"중남미·유럽","geo":"복수 정보","pr":"현장 후보","cat":"애드테크/미디에이션","fit":"낮음","adv":"매우 높음","why":"게임 중심 mediation/monetization 플랫폼으로 중소형 hybrid title의 자동 최적화 비교 대상.","note":"시간표와 참석자 직무를 확인해 현장 미팅 여부 결정. 내부 KPI의 정확한 수치보다 의사결정 방식 질문.","rev":"100억 ~ 500억","tt":"CAS.AI Mediation, CAS.AI Manager","lvl":"회사 규모·사업범위 기반 추정(확인 필요)","purpose":"AdMob 중심 구조에서 순증 수요·UA 성과·운영비용을 검증할 테스트 조건 pr":"우선","cat":"게임사/퍼블리셔","fit":"높음","adv":"높음","why":"하이브리드캐주얼·시뮬레이션형 모바일 게임의 글로벌 스케일 경험. ads+IAP 구조 논의 가치.","note":"사전 예약 권장. 참석자 직급과 담당 장르가 맞지 않으면 현장 네트워킹으로 전환.","rev":"500억 ~ 1000억","tt":"모바일 시뮬레이션·하이브리드캐주얼 포트폴리오","lvl":"회사 규모·사업범위 기반 추정(확인 필요)","purpose":"시뮬레이션형 하이브리드캐주얼에서 광고와 IAP를 함께 성장시킨 구조를 확인한다. 우리 하이브리드캐주얼 퍼블리싱 라인업의 수익화 설계 표준을 만들고, 중동·남아시아 개발 조직과의 협업 조건을 파악하는 것이 목표다.","exp":"광고를 먼저 안정화하고 IAP를 단계적으로 붙였다는 설명과, 파생 타이틀 전략의 효율을 강조할 가능성이 높다. 콘텐츠 공급은 템플릿화로 해결한다고 답할 것이다. 우리가 확인할 것은 파생과 심화 중 선택 근거이며, 이는 퍼블리싱 포트폴리오 전략의 핵심 판단이다.","how":"상대적으로 덜 알려진 회사이므로 포트폴리오 확인을 미팅 전에 마치고, 현장에서는 대표 타이틀 1~2개를 명시적으로 언급하며 질문한다. 우리가 제공할 수 있는 지역 퍼블리싱 가치(한국·일본 운영 경험)를 명확히 제시하면 대화의 균형이 맞는다.","ask":"수익화 성장 순서 정리 / 파생 vs 심화 판단 근거 / 지역 퍼블리싱 협업 관심도","ice":"","agenda":"","en":["In your simulation-style casual titles, did ads or IAP come first, and how did you grow the second one?","Does the same core across multiple themes outperform going deep on one title? What decided it?","Would you consider a partner running Korea and Japan while you keep development?"],"qs":[["수익화 구조","시뮬레이션형 캐주얼에서 광고와 IAP의 비중을 어떤 순서로 키웠나요? IAP가 먼저 자리 잡은 뒤 광고를 늘리는 편인가요, 반대인가요?"],["메타 설계","시뮬레이션 메타(업그레이드·수집)는 콘텐츠 소모가 빠릅니다. 콘텐츠 공급 주기와 이용자 진행 속도를 어떻게 맞추시나요?"],["확장","같은 코어로 여러 테마를 파생시키는 방식과, 한 타이틀을 깊게 키우는 방식 중 어느 쪽이 결과가 좋았나요? 판단 근거는 무엇이었나요?"],["UA","하이브리드캐주얼 CPI가 오른 환경에서 지금도 성과가 나는 크리에이티브 유형은 무엇인가요? 최근 6개월간 바뀐 점이 있나요?"],["협업 구조","한국·일본 시장 진입에 관심이 있나요? 우리가 지역 퍼블리싱을 맡고 개발을 그쪽이 담당하는 구조에 대해 어떻게 보시나요?"]],"deep":1},{"n":"18","c":"GHOST STUDIO CO LIMITED","ct":"홍콩","rg":"중화권","geo":"확인됨","pr":"반드시","cat":"게임사/퍼블리셔","fit":"높음","adv":"높음","why":"Match Triple 3D와 Mergetopia 등 매치·머지 포트폴리오가 직접 겹침. 경쟁작 운영·메타 구조 벤치마크 가치가 높음.","note":"시간표와 참석자 직무를 확인해 현장 미팅 여부 결정. 내부 KPI의 정확한 수치보다 의사결정 방식 질문.","rev":"500억 ~ 1000억","tt":"Match Triple 3D, Mergetopia","lvl":"회사 규모·사업범위 기반 추정(확인 필요)","purpose":"Match Triple 3D·Mergetopia는 우리 플래그십과 장르가 정면으로 겹치는 경쟁 포트폴리오다. 경쟁사 벤치마크 목적을 숨기지 않되, 서로 공개 가능한 수준에서 매치·머지 장르의 현재 UA 환경과 메타 구조 트렌드를 교환하는 것이 목표다.","exp":"장르별 UA 효율과 지역 차이에 대해서는 비교적 개방적으로 답할 가능성이 있으나, 메타·경제 세부는 방어적일 수 있다. 광고 배치는 스테이지 종료 지점 중심으로 설계한다는 원칙 수준의 답이 예상된다. 우리가 얻어야 할 것은 지역별 지표 차이와 현지화 조정 사례이며, 이는 플래그십 국가 전략에 직접 쓰인다.","how":"경쟁 관계를 전제로 “서로 공개 가능한 범위”를 먼저 정하고 시작하는 것이 신뢰를 만든다. 우리 쪽에서 먼저 하나를 공개(예: 한국 시장 매치3 이용자 특성)하고 동일한 수준의 정보를 요청하는 교환 방식이 효과적이다. 제품 세부는 캐묻지 않고, 시장·지역 정보에 집중한다.","ask":"지역별 지표 차이 정보 교환 / 현지화 조정 사례 / 무해 협업 형태 탐색","ice":"Match Triple 3D와 Mergetopia처럼 매치와 머지를 모두 운영한다는 점을 언급하고, 두 장르 이용자의 가장 큰 차이를 묻는다.","agenda":"매치·머지 게임의 장기 제품 운영, 경제 설계, LiveOps 전략을 교류하고, 한국과 범중화권을 연결하는 공동개발·퍼블리싱·시장 진출 가능성을 논의한다.","en":["Between match-3, triple match and merge, which has the best UA efficiency right now, and has that order changed in the past year?","When you layer story and decoration meta onto merge, how do you keep it from eating core play time?","How do the same titles perform differently between Greater China, Southeast Asia and the West, and what localization change mattered most?"],"qs":[["장르 현황","매치3와 트리플 매치, 머지 중 지금 UA 효율이 가장 좋은 장르는 어디라고 보시나요? 최근 1년간 순위가 바뀌었나요?"],["메타 구조","Mergetopia처럼 머지에 스토리·꾸미기 메타를 얹을 때, 메타가 코어 플레이 시간을 잡아먹는 문제를 어떻게 관리하나요?"],["수익화","트리플 매치는 한 판이 길어 인터스티셜 삽입 지점이 제한됩니다. 세션 구조를 해치지 않는 광고 배치를 어떻게 설계하셨나요?"],["지역","중화권·동남아와 서구 시장에서 같은 매치·머지 타이틀의 지표 차이가 어떻게 나타나나요? 현지화에서 가장 효과가 컸던 조정은 무엇인가요?"],["협업 구조","경쟁 장르이지만 지역 교차 퍼블리싱이나 광고 인벤토리 교환처럼 서로 손해가 없는 협업 형태에 관심이 있나요?"]],"deep":1},{"n":"19","c":"Hungry Studio","ct":"홍콩(운영사) / 싱가포르(본사 표기)","rg":"중화권·동남아시아","geo":"복수 정보","pr":"반드시","cat":"게임사/퍼블리셔","fit":"높음","adv":"높음","why":"Block Blast, Match Out, Double Tile 등 퍼즐 히트 포트폴리오. 현재 퍼즐 트렌드/UA 크리에이티브 벤치마킹에 매우 유용.","note":"사전 예약 우선. 참석자의 제품·사업 책임 범위를 확인하고 구체적인 후속 과제를 합의.","rev":"500억 ~ 1000억","tt":"Block Blast, Match Out, Double Tile","lvl":"공개자료·회사 규모 기반 구간 추정","purpose":"Block Blast는 최근 캐주얼 퍼즐에서 가장 빠르게 확장한 사례다. 단순한 코어로 대규모 이용자를 확보하고 유지한 방식(크리에이티브·리텐션·광고 밀도)을 확인해, 우리 플래그십의 초기 확장 전략과 퍼블리싱 라인업의 기준선을 다시 세우는 것이 목표다.","exp":"오가닉 비중이 컸다는 설명과 단순성 유지를 원칙으로 강조할 가능성이 높다. 광고 밀도는 국가별로 다르게 적용하고 리텐션 지표를 기준으로 관리한다는 답이 예상된다. 우리가 확보할 것은 “되돌린 기능” 사례이며, 이는 플래그십 기능 확장 압력에 대응할 근거 자료로 쓸 수 있다.","how":"최근 성과가 가장 좋은 회사이므로 상대가 미팅 요청을 많이 받는 상황을 전제하고, 질문 3개로 압축한다. 성장 비결을 통째로 묻는 대화는 피하고 “되돌린 결정”과 “국가별 차이”처럼 답하기 쉬운 각도로 접근한다. 사전 예약을 최우선으로 잡아야 하는 상대다.","ask":"되돌린 기능 사례 / 국가별 광고 밀도 정책 / 크리에이티브 유형 트렌드","ice":"Block Blast가 최근 글로벌 퍼즐 시장의 대표적인 성공 사례라는 점을 언급하고, 성장 과정에서 팀이 가장 예상하지 못했던 순간을 묻는다.","agenda":"Block Blast의 단순한 제품 설계, 크리에이티브 확장, IAA 수익화와 장기 성장 경험을 교류하고, 글로벌 및 범중화권 시장에서의 전략적 협력 가능성을 논의한다.","en":["How do you separate UA-driven growth from organic and viral growth in Block Blast's curve?","With pressure to add features, what kept the core simple - and did you ever ship something and roll it back?","As DAU scaled, which metric did you watch first when raising ad density, and do you vary it by country?"],"qs":[["확장 구조","Block Blast의 성장 곡선에서 UA 투입과 오가닉·바이럴의 기여를 어떻게 구분해서 보고 계신가요? 전환점이 된 시점이 있었나요?"],["단순성 유지","기능을 추가하라는 압력이 큰 상황에서 코어를 단순하게 유지한 판단 기준은 무엇인가요? 추가했다가 되돌린 기능이 있나요?"],["리텐션","목표가 명확하지 않은 엔드리스 퍼즐에서 장기 리텐션을 만드는 장치는 무엇이라고 보시나요? 랭킹·연속 플레이·수집 중 어느 쪽이 효과적이었나요?"],["수익화","대규모 DAU에서 광고 밀도를 올릴 때 가장 먼저 확인하는 지표는 무엇인가요? 국가별로 광고 밀도를 다르게 적용하시나요?"],["크리에이티브","지금도 성과가 나는 크리에이티브 유형은 무엇인가요? 게임 내 실제 플레이와 다르게 과장된 소재의 장기 영향은 어떻게 평가하시나요?"]],"deep":1},{"n":"20","c":"Infinity Games","ct":"포르투갈","rg":"유럽","geo":"확인됨","pr":"현장 후보","cat":"게임사/퍼블리셔","fit":"높음","adv":"높음","why":"relaxing puzzle 중심 포트폴리오. 저스트레스 퍼즐·광고 경험 설계 참고에 적합.","note":"시간표와 참석자 직무를 확인해 현장 미팅 여부 결정. 내부 KPI의 정확한 수치보다 의사결정 방식 질문.","rev":"100억 ~ 500억","tt":"Infinity Loop, Energy, Harmony","lvl":"회사 규모·사업범위 기반 추정(확인 필요)","purpose":"캐주얼·퍼즐 제품 전략, LiveOps, UA, IAA·IAP 혼합 운영 및 협업 가능성 비교.","exp":"일반적으로 CPI·D1·D7과 초기 ROAS로 1차 선별하고 D30 LTV·콘텐츠 소진 속도로 확대 여부를 정한다. 광고는 리텐션 하락을 가드레일로 두고 rewarded 중심으로 조정한다.","how":"먼저 “핵심 타이틀의 D1/D7/D30? / 광고 vs IAP 비중?”를 묻고, 일반론 대신 최근 6개월의 실제 사례를 기준으로 판단 수치, 실패 사례, 적용 전제와 90일 내 검증 가능한 후속 실험을 함께 질문한다.","ask":"","ice":"","agenda":"","en":[],"qs":[["","핵심 타이틀의 D1/D7/D30?"],["","광고 vs IAP 비중?"],["","Creative/UA 실험 프로세스?"]],"deep":0},{"n":"21" arket was hardest?","How do you hold the balance between brand and performance demand, and how much of the quality control is your own tech?","When you extended the IP into new genres, what separated the successes from the failures?"],"qs":[["규제 대응","아동·가족 이용자가 포함된 서비스에서 광고 수익을 유지하면서 지역별 규제(연령 인증·데이터·광고 카테고리)를 어떻게 관리하나요? 가장 까다로운 시장은 어디였나요?"],["광고 품질","브랜드 광고와 퍼포먼스 광고의 비중을 어떻게 유지하시나요? 광고 품질 관리에 자체 기술을 어느 범위까지 쓰시나요?"],["IP 장기 운영","10년 이상 유지된 IP에서 캐릭터를 새 장르로 확장할 때 성공과 실패를 갈랐던 요인은 무엇이었나요?"],["수익화","광고 중심 구조에서 IAP·구독을 붙일 때 가족 이용자층의 특성 때문에 달랐던 점은 무엇인가요?"],["협업 구조","한국에서 장기 운영된 캐주얼 IP와 캐릭터 협업이나 크로스 프로모션을 진행할 여지가 있나요?"]],"deep":1},{"n":"23","c":"Peaksel","ct":"세르비아","rg":"유럽","geo":"확인됨","pr":"현장 후보","cat":"게임사/퍼블리셔","fit":"높음","adv":"높음","why":"대규모 다작 앱/게임 portfolio operator. 광고형 casual의 포트폴리오 운영·UA 효율화 참고.","note":"시간표와 참석자 직무를 확인해 현장 미팅 여부 결정. 내부 KPI의 정확한 수치보다 의사결정 방식 질문.","rev":"100억 ~ 500억","tt":"모바일 게임·유틸리티 앱 포트폴리오","lvl":"회사 규모·사업범위 기반 추정(확인 필요)","purpose":"캐주얼·퍼즐 제품 전략, LiveOps, UA, IAA·IAP 혼합 운영 및 협업 가능성 비교.","exp":"일반적으로 CPI·D1·D7과 초기 ROAS로 1차 선별하고 D30 LTV·콘텐츠 소진 속도로 확대 여부를 정한다. 광고는 리텐션 하락을 가드레일로 두고 rewarded 중심으로 조정한다.","how":"먼저 “핵심 타이틀의 D1/D7/D30? / 광고 vs IAP 비중?”를 묻고, 일반론 대신 최근 6개월의 실제 사례를 기준으로 판단 수치, 실패 사례, 적용 전제와 90일 내 검증 가능한 후속 실험을 함께 질문한다.","ask":"","ice":"","agenda":"","en":[],"qs":[["","핵심 타이틀의 D1/D7/D30?"],["","광고 vs IAP 비중?"],["","Creative/UA 실험 프로세스?"]],"deep":0},{"n":"24","c":"Playtika","ct":"이스라엘","rg":"중동","geo":"확인됨","pr":"반드시","cat":"게임사/퍼블리셔","fit":"높음","adv":"높음","why":"대형 casual 포트폴리오의 LiveOps·경제·IAP 최적화가 강점. 광고보다는 장기 LTV 관점의 전략 미팅.","note":"사전 예약 권장. 참석자 직급과 담당 장르가 맞지 않으면 현장 네트워킹으로 전환.","rev":"5000억 이상","tt":"Slotomania, Bingo Blitz, June's Journey, Best Fiends","lvl":"공개자료·회사 규모 기반 구간 추정","purpose":"대형 캐주얼·소셜카지노 포트폴리오의 LiveOps 체계와 웹 직접판매(D2C) 구조를 확인한다. 플레이링스 소셜카지노와 애니팡 계열 모두에 적용 가능한 이용자 경제·VIP 운영·D2C 전환 기준을 확보하는 것이 목표다.","exp":"공통 LiveOps·데이터 플랫폼을 강점으로 설명하고, D2C 비중 확대를 중요한 전략으로 언급할 가능성이 높다. VIP 운영은 상당 부분 사람이 개입한다는 답이 예상된다. 우리가 확보할 것은 D2C 전환 설계(유도 지점·인센티브·부작용)이며, 플레이링스에 가장 직접적으로 적용 가능한 항목이다.","how":"플레이링스를 운영하는 사업자로서 동종 대화를 할 수 있다는 점을 앞세운다. 일반적인 LiveOps 질문보다 D2C와 VIP 운영에 시간을 집중 배분하는 것이 실익이 크다. 경제 인플레이션 통제는 애니팡 장기 운영 경험과 직접 교환할 수 있는 주제이므로 우리 사례를 하나 준비해 간다.","ask":"D2C 웹상점 설계 참고 구조 / VIP 운영 자동화 범위 / 아시아 협업·라이선스 관심도","ice":"Bingo Blitz와 June’s Journey를 장기간 데이터 기반으로 운영해 온 점을 언급하고, 최근 LiveOps에서 가장 크게 달라진 이용자 행동을 묻는다.","agenda":"성숙 캐주얼 게임의 데이터 기반 LiveOps, CRM, 개인화, 포트폴리오 운영 경험을 교류하고, 기술·마케팅·아시아 시장 개발 분야의 전략적 협력 가능성을 논의한다.","en":["Do you run a shared LiveOps platform across titles, and where do you draw the line with per-title operations?","How did you grow the share of revenue going through your own web shop, and did it hurt retention or store relationships?","In long-running titles, how do you control economy inflation - and which decision was hardest to reverse?"],"qs":[["LiveOps 체계","여러 타이틀에 공통 적용하는 LiveOps 플랫폼이 있나요? 타이틀별 개별 운영과 공통 플랫폼의 경계는 어디에 두시나요?"],["D2C","웹 상점 등 앱 외부 결제 비중을 어떻게 키우셨나요? 이용자를 웹으로 유도할 때 리텐션이나 스토어 관계에 부작용은 없었나요?"],["고LTV 운영","상위 결제 이용자 관리에서 자동화와 사람의 개입 비율은 어떻게 되나요? VIP 운영이 전체 매출에서 차지하는 비중은 어느 수준인가요?"],["경제 설계","오래 운영된 타이틀의 이용자 경제에서 인플레이션을 어떻게 통제하시나요? 되돌리기 어려웠던 결정은 무엇이었나요?"],["협업 구조","한국 소셜카지노 사업자와 협업하거나 지역 라이선스 형태로 일한 사례가 있나요? 아시아 시장 확장에서 가장 큰 장벽은 무엇이라고 보시나요?"]],"deep":1},{"n":"25","c":"Sonderads","ct":"키프로스","rg":"유럽","geo":"추정","pr":"후순위","cat":"UA/퍼포먼스 마케팅","fit":"중간","adv":"높음","why":"CPI/CPA/ROAS 기반 media buying과 대량 creative 제작을 표방. UA creative 벤치마크와 외부 실행 파트너 검토 가치.","note":"SONDERADS TECHNOLOGIES LTD와 동일 회사 표기 가능.","rev":"100억 ~ 500억","tt":"퍼포먼스 마케팅, UA 크리에이티브·미디어바잉","lvl":"회사 규모·사업범위 기반 추정(확인 필요)","purpose":"외부 UA·크리에이티브 실행 파트너로서 실제 역량을 검증한다. 우리 하이브리드캐주얼 퍼블리싱과 플래그십 소프트론치에서 내부 인력으로 감당하기 어려운 크리에이티브 물량을 외부에 맡길 수 있는지, 성과 검증과 수수료 구조를 확인하는 것이 목표다.","exp":"운용 규모와 크리에이티브 물량을 강점으로 제시하고, 수수료는 광고비 비율 기반을 제안할 가능성이 높다. 성과 검증 질문에 구체적인 비교 설계를 제시하지 못하면 신뢰도를 낮춰야 하는 신호로 본다. 우리가 확보할 것은 크리에이티브 단가·물량과 자산 소유권 조건이며, 이 두 항목이 내부 제작 대비 실익을 결정한다.","how":"에이전시 미팅은 역량 설명을 듣는 자리가 아니라 검증 설계를 요구하는 자리로 운영한다. 우리가 이미 내부에서 하고 있는 수준을 먼저 밝히고, “그 대비 무엇이 나아지는지 어떻게 증명할 것인가”를 핵심 질문으로 둔다. 크리에이티브 샘플은 반드시 퍼즐 장르 실제 사례로 요청한다.","ask":"퍼즐 장르 크리에이티브 샘플·단가표 / 성과 검증 테스트 설계 / 데이터·자산 소유권 조건","ice":"","agenda":"","en":["How much monthly spend do you currently run in casual puzzle, and do you have people dedicated to the genre?","How would you prove the lift over what we already do in house - what test design and comparison group?","Who owns the creative and the data, and what happens to those assets if we end the contract?"],"qs":[["실행 역량","캐주얼 퍼즐 카테고리에서 현재 운용 중인 월 광고비 규모와 담당 타이틀 수는 어느 정도인가요? 퍼즐 장르 전담 인력이 있나요?"],["크리에이티브","월 제작 가능한 크리에이티브 수와 제작 단가는 어떻게 산정되나요? 소재 기획은 그쪽에서 하나요, 우리가 방향을 주는 구조인가요?"],["성과 검증","에이전시 성과를 우리가 검증할 수 있는 방법은 무엇인가요? 내부 운영 대비 개선분을 분리해 증명할 설계(테스트 기간·비교군)를 제안해 주실 수 있나요?"],["수수료","수수료는 광고비 비율인가요, 성과 기반인가요? 데이터·크리에이티브 소유권과 계약 종료 시 자산 인수 조건은 어떻게 되나요?"],["지역","한국·일본 시장 집행 경험이 있나요? 해당 지역 채널과 크리에이티브 문법 차이에 대응할 수 있는 인력이 있나요?"]],"deep":1},{"n":"26","c":"Supercell","ct":"핀란드","rg":"유럽","geo":"확인됨","pr":"반드시","cat":"게임사/퍼블리셔","fit":"높음","adv":"높음","why":"광고수익화보다는 장기 IP·메타·LiveOps·고LTV 설계 학습가치가 높음. CEO급 전략 네트워킹 가치.\nSupercell의 Merge Mansion 인수","note":"시간표와 참석자 직무를 확인해 현장 미팅 여부 결정. 내부 KPI의 정확한 수치보다 의사결정 방식 질문.","rev":"5000억 이상","tt":"Clash of Clans, Brawl Stars, Clash Royale, Hay Day","lvl":"공개자료·회사 규모 기반 구간 추정","purpose":"광고 수익화가 아니라 장기 IP·커뮤니티·제품 원칙 관점에서 플래그십의 설계 전제를 검증한다. 애니팡 10년 운영 경험을 가진 팀으로서 “10년 운영을 가정한 게임에서 출시 전에 반드시 정리해야 하는 것”에 대한 판단을 얻는 것이 목표다.","exp":"강한 코어, 깊은 사회적 동기, 자율적 소규모 팀을 강조할 가능성이 높고, 지표가 좋아도 “장기적으로 확신이 없어서” 중단한 사례를 언급할 수 있다. 우리가 얻어야 할 것은 벤치마크 수치가 아니라 판단 프레임이며, 특히 마지막 질문에 대한 답은 플래그십 출시 전 체크리스트로 바로 정리할 수 있다.","how":"수치를 묻는 질문은 이 미팅에서 가치가 낮다. 제품 철학과 실제 의사결정 사례를 요청하고, 기능을 추가하지 않고 제거하거나 재설계한 사례를 구체적으로 물어본다. 마지막 질문은 우리 상황을 20초 안에 설명한 뒤 조언을 요청하는 형태로 던지고, 답을 그 자리에서 메모해 체크리스트로 남긴다.","ask":"장기 운영 전제 출시 전 체크리스트(단순화 항목·선구축 시스템) / 기능 제거 사례","ice":"여러 게임을 10년 이상 운영하면서도 단순한 코어와 강한 커뮤니티를 유지하는 점을 언급하고, 오래된 게임에서 최근 새롭게 배운 점을 묻는다.","agenda":"단순한 제품 설계, 깊이 있는 LiveOps, 팀의 자율성을 바탕으로 게임과 조직을 10년 이상 운영하는 관점을 교류하고, 위메이드플레이의 장수 애니팡 운영 경험도 함께 공유한다.","en":["In your long-running games, what player behaviour or system looked minor early but became central years later?","As live ops pile up, how do you keep the game approachable for new and returning players? Have you removed features?","If you were building a global match-3 or merge title meant to run for ten years, what would you simplify before launch and what would you build early?"],"qs":[["장기 신호","오래 운영한 게임에서 초기에는 작아 보였지만 수년 뒤 핵심이 된 이용자 행동이나 시스템은 무엇이었나요?"],["복잡도 관리","LiveOps가 쌓이면 신규·복귀 이용자의 진입장벽이 높아집니다. 이 문제를 제품 원칙으로 어떻게 해결하시나요? 기능을 제거한 사례가 있나요?"],["판단 기준","장기 IP가 될 가능성을 소프트론치 지표 밖에서 판단하는 정성적 신호는 무엇인가요? 지표가 좋은데 중단한 프로젝트의 이유는 무엇이었나요?"],["팀 구조","소규모 팀에 장기 책임을 맡기는 구조에서 실패한 프로젝트의 팀은 어떻게 처리하시나요? 그 판단이 조직 문화에 준 영향은 무엇인가요?"],["우리 케이스","10년 운영을 가정한 글로벌 매치3·머지2를 준비한다면, 출시 전에 반드시 단순화해야 할 것과 미리 구축해야 할 시스템은 각각 무엇이라고 보시나요?"]],"deep":1},{"n":"27","c":"Wildlife Studios","ct":"브라질","rg":"중남미","geo":"확인됨","pr":"우선","cat":"게임사/퍼블리셔","fit":"매우 높음","adv":"높음","why":"브라질에서 시작해 글로벌로 성장한 대형 모바일 게임사. 60개 이상의 게임과 30억 회 이상의 다운로드를 보유하며, Zooba·Tennis Clash의 장기 LiveOps뿐 아니라 Midas Merge·Secret Puzzle Society·Paradise Paws로 퍼즐·머지 장르 접점도 확대하고 있어 위메이드플레이와 제품·운영 관점의 직접적인 대화 가치가 높음.","note":"사전 예약 권장. 참석자가 퍼즐·머지 제품 또는 퍼블리싱 담당인지 먼저 확인하고, 실제 타이틀의 의사결정 사례와 90일 내 가능한 공동 검증 범위에 집중.","rev":"1000억 ~ 5000억","tt":"Zooba, Tennis Clash, Sniper 3D, Midas Merge, Secret Puzzle Society, Paradise Paws","lvl":"공개자료·회사 규모 기반 구간 추정","purpose":"Zooba·Tennis Clash의 장기 운영 역량에 Midas Merge·Secret Puzzle Society·Paradise Paws로 퍼즐·머지 접점이 생긴 회사다. 기존 대형 타이틀을 운영하면서 신장르에 진입할 때의 조직·지표 판단을 확인하고, 중남미 시장과 글로벌 UA 역량을 우리 플래그십에 연결할 여지를 가늠하는 것이 목표다.","exp":"기존 LiveOps·UA 인프라는 재사용했지만 퍼즐·머지의 레벨 설계와 경제는 새로 배웠다는 답이 예상된다. 중남미는 결제율이 낮고 광고 비중이 높다는 구조적 차이를 언급할 가능성이 크다. 우리가 확보할 것은 중남미 진입 시 조정 항목이며, 플래그십 국가 전략에서 아직 공백인 지역이다.","how":"퍼즐·머지 신작이 아직 초기 단계일 가능성이 높아, 성과를 캐묻기보다 “진입 과정의 학습”을 묻는 각도가 안전하고 생산적이다. 우리 쪽에서 한국·일본 퍼즐 시장의 구조를 먼저 공개하면 지역 정보 교환이 성립한다. 중남미 퍼블리싱 협업은 구체적인 형태로 제안해 두고 후속 채널을 받는 것을 목표로 한다.","ask":"중남미 캐주얼 수익화 구조 차이 / 신장르 진입 학습 요약 / 중남미 퍼블리싱 협업 가능성","ice":"","agenda":"","en":["Moving from action and sports into puzzle and merge, what carried over from your existing teams and what did you have to learn?","Do you judge a new-genre title by different metrics than your established ones?","How does casual puzzle monetization in Latin America differ from North America and Europe - what must be adjusted before entering?"],"qs":[["신장르 진입","액션·스포츠 중심 포트폴리오에서 퍼즐·머지로 진입할 때 기존 팀의 역량이 그대로 쓰인 부분과 새로 배워야 했던 부분은 각각 무엇이었나요?"],["판단 지표","Midas Merge 같은 신장르 타이틀을 계속 투자할지 결정하는 기준은 기존 타이틀과 다른가요? 어떤 지표를 다르게 보시나요?"],["UA 역량","글로벌 대규모 UA를 운영하는 조직에서 퍼즐·머지 장르의 크리에이티브는 기존 장르와 무엇이 가장 달랐나요?"],["지역","중남미에서 캐주얼 퍼즐의 수익화 구조(ARPDAU·결제율·광고 수용성)는 북미·유럽과 어떻게 다른가요? 진입할 때 반드시 조정해야 하는 것은 무엇인가요?"],["협업 구조","한국 개발사의 매치3·머지2 플래그십을 중남미에 내보낸다면 Wildlife가 기여할 수 있는 부분은 퍼블리싱인가요, UA인가요, 현지화인가요?"]],"deep":1},{"n":"28","c":"Wooga GmbH","ct":"독일","rg":"유럽","geo":"확인됨","pr":"우선","cat":"게임사/퍼블리셔","fit":"높음","adv":"높음","why":"June's Journey 등 장수 casual의 narrative/meta/LiveOps 노하우가 강점.","note":"사전 예약 권장. 참석자 직급과 담당 장르가 맞지 않으면 현장 네트워킹으로 전환.","rev":"1000억 ~ 5000억","tt":"June's Journey","lvl":"공개자료·회사 규모 기반 구간 추정","purpose":"June's Journey는 서사·꾸미기 메타로 캐주얼 퍼즐을 장기 고LTV 타이틀로 만든 대표 사례다. 우리 매치3·머지2 플래그십의 메타 레이어(스토리·장식·수집) 설계 원칙과 제작 비용 구조를 확보하는 것이 목표다.","exp":"스토리와 장식 메타가 장기 리텐션과 결제에 기여한다는 설명과, 콘텐츠 제작 비용이 크다는 현실적인 답이 예상된다. 광고는 고LTV 타이틀에서 신중하게 접근한다고 말할 가능성이 높다. 우리가 확보할 것은 에피소드 제작 리소스 단위와 “스토리를 보지 않는 이용자”를 위한 병행 설계이며, 후자는 아시아 이용자 대응에 특히 중요하다.","how":"메타 설계는 우리 플래그십의 가장 큰 미결 영역이므로, 이 미팅은 제품 기획자가 직접 참석하는 것이 좋다. 우리 매치3·머지2의 메타 구상 1장을 가져가 “스토리 소비 비중이 낮은 시장에서도 작동하는지”를 중심으로 검증받는다. 광고 도입 여부 판단 기준은 별도로 기록해 수익화 설계에 반영한다.","ask":"메타 레이어 설계 원칙 / 에피소드 제작 리소스 단위 / 고LTV 타이틀의 광고 도입 판단 기준","ice":"","agenda":"","en":["How do you measure what narrative and decoration meta contribute to retention, and what do you design for players who skip the story?","What does producing one chapter cost, and how do you keep supply ahead of consumption?","In a high-LTV casual title, how do you decide whether to put ads in at all?"],"qs":[["메타 설계","서사와 꾸미기 메타가 리텐션에 기여하는 정도를 어떻게 측정하시나요? 스토리를 소비하지 않는 이용자 비중은 어느 정도이고, 그들을 위한 설계는 무엇인가요?"],["콘텐츠 비용","챕터·에피소드 1개를 만드는 데 드는 제작 리소스는 어느 정도인가요? 콘텐츠 소모 속도와 공급 속도를 맞추기 위해 어떤 장치를 쓰시나요?"],["이용자층","중장년·여성 이용자 비중이 높은 타이틀에서 UA 크리에이티브와 게임 내 실제 경험의 간극을 어떻게 관리하나요?"],["수익화","고LTV 캐주얼에서 광고를 넣는 판단 기준은 무엇인가요? 광고를 넣지 않는 선택이 더 유리한 조건은 어떤 경우인가요?"],["협업 구조","한국·아시아 시장에서 서사형 캐주얼의 반응을 확인해 본 경험이 있나요? 현지화에서 가장 중요한 요소는 무엇이라고 보시나요?"]],"deep":1},{"n":"29","c":"ZephyrMobile","ct":"체코","rg":"유럽","geo":"확인됨","pr":"반드시","cat":"게임사/퍼블리셔","fit":"높음","adv":"높음","why":"Color Sort 3D, Nonogram, Jigsaw 등 광고친화적 puzzle 포트폴리오와 UA/monetization 내재화.","note":"사전 예약 권장. 참석자 직급과 담당 장르가 맞지 않으면 현장 네트워킹으로 전환.","rev":"500억 ~ 1000억","tt":"Color Sort 3D, Nonogram, Jigsaw Puzzles","lvl":"회사 규모·사업범위 기반 추정(확인 필요)","purpose":"Color Sort 3D·Nonogram·Jigsaw처럼 광고 친화적 퍼즐 포트폴리오를 자체 UA·수익화로 운영하는 구조를 확인한다. 우리 퍼블리싱 라인업에서 IAA 단독 수익 모델의 현실적인 상한과 운영 비용을 파악하는 것이 목표다.","exp":"광고 단독 모델의 ARPDAU 상한과 미디에이션 최적화 경험을 구체적으로 답할 가능성이 있다. 교차 프로모션은 유사 이용자층 조합에서만 효과가 있다는 답이 예상된다. 우리가 확보할 것은 IAA 단독 모델의 손익 구조와 순증 검증 방식이며, 퍼블리싱 계약 조건 설계에 직접 반영한다.","how":"수익화 실무 대화가 가능한 상대이므로, 미디에이션 구성과 순증 검증 방법을 구체적으로 물어 우리 방식과 비교한다. 우리 쪽 구조를 범위 수준으로 공개하면 상대도 구체적으로 답한다. 협업 논의는 지역 퍼블리싱 형태로 명확히 제안한다.","ask":"IAA 단독 모델 손익 구조 / 순증 검증 방식 / 지역 퍼블리싱 협업 관심도","ice":"Color Sort 3D·Nonogram·Jigsaw처럼 서로 다른 퍼즐을 광고친화적으로 운영하는 점을 언급하고, 타이틀 간에 가장 잘 공유되는 학습을 묻는다.","agenda":"광고친화적 퍼즐 포트폴리오 운영과 UA·수익화 내재화 경험을 교류하고, 가능성 있는 퍼즐 코어에 깊이 있는 메타와 LiveOps를 더하는 협력 방안을 논의한다.","en":["In an ads-only title, where does ARPDAU hit a ceiling, and what raised it?","Does cross-promotion between different puzzle types actually work? Which combinations worked best?","Do you manage mediation and price floors in house, and how do you verify that a new demand source is incremental?"],"qs":[["IAA 상한","IAP 없이 광고만으로 운영하는 타이틀에서 ARPDAU 상한은 어느 수준에서 막히나요? 그 상한을 올린 방법은 무엇이었나요?"],["포트폴리오","노노그램·직소처럼 이용자 특성이 다른 퍼즐을   var KEY = 'bcn26.meetingdesk.v1';
  var S = {star:{}, status:{}, memo:{}, chk:{}, ag:{}, theme:null, view:null};
  try { var raw = localStorage.getItem(KEY); if (raw) { var p = JSON.parse(raw); for (var k in S) if (p[k]) S[k] = p[k]; } } catch(e){}
  var saveT = null;
  function save(){
    if (saveT) clearTimeout(saveT);
    saveT = setTimeout(function(){
      try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){}
    }, 150);
  }

  /* ---- theme ---- */
  var tb = document.getElementById('themeBtn');
  if (S.theme) document.documentElement.setAttribute('data-theme', S.theme);
  tb.addEventListener('click', function(){
    var cur = document.documentElement.getAttribute('data-theme');
    var isDark = cur ? cur === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    S.theme = isDark ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', S.theme);
    save();
  });

  /* ---- helpers ---- */
  /* 반드시 중에서도 별도 표기가 필요한 업체 — 목록 행을 옅은 노란색으로 */
  var HL = {'Easybrain':1,'Paxie Games':1,'PlaySimple Games Limited':1,
            'Voodoo':1,'Supercell':1,'Zynga':1};
  var PCLS = {'반드시':'must','우선':'pri','현장 후보':'field','확인 필요':'chk','자사':'own','후순위':'low'};
  var STL = {done:'완료', hold:'보류', plan:'예정'};
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function pill(t, cls){ return '<span class="pill '+(cls||'')+'">'+esc(t)+'</span>'; }
  function uniq(key){
    var m = {};
    ROWS.forEach(function(r){ if (r[key]) m[r[key]] = 1; });
    return Object.keys(m).sort(function(a,b){ return a.localeCompare(b,'ko'); });
  }
  function fillSel(id, label, vals){
    var el = document.getElementById(id);
    el.innerHTML = '<option value="">전체</option>' + vals.map(function(v){
      return '<option>'+esc(v)+'</option>'; }).join('');
    el.addEventListener('change', render);
    return el;
  }
  var fCt  = fillSel('fCt','국가',uniq('ct'));
  var fCat = fillSel('fCat','분류',uniq('cat'));
  var fRev = fillSel('fRev','연매출',['100억 미만','100억 ~ 500억','500억 ~ 1000억','1000억 ~ 5000억','5000억 이상']);
  var fFit = fillSel('fFit','적합도',uniq('fit'));
  var fAdv = fillSel('fAdv','광고가치',uniq('adv'));
  var fSt  = document.getElementById('fSt');
  fSt.innerHTML = '<option value="">전체</option><option value="done">완료</option><option value="plan">예정</option><option value="hold">보류</option><option value="none">미기록</option>';
  fSt.addEventListener('change', render);

  /* ---- search index ---- */
  ROWS.forEach(function(r){
    r._s = [r.c, r.ct, r.cat, r.tt, r.why, r.purpose, r.rg, r.rev,
            r.qs.map(function(q){ return q[1]; }).join(' '), r.en.join(' ')]
           .join(' ').toLowerCase();
  });

  /* ---- tabs ---- */
  var TABS = [
    {k:'반드시', t:'반드시'}, {k:'우선', t:'우선'}, {k:'star', t:'★ 내 목록'},
    {k:'현장 후보', t:'현장 후보'}, {k:'확인 필요', t:'확인 필요'},
    {k:'후순위', t:'후순위'}, {k:'', t:'전체'}
  ];
  var tab = '반드시';
  var tabsEl = document.getElementById('tabs');
  function tabCount(k){
    if (k === 'star') return ROWS.filter(function(r){ return S.star[r.n]; }).length;
    if (!k) return ROWS.length;
    return ROWS.filter(function(r){ return r.pr === k; }).length;
  }
  function paintTabs(){
    tabsEl.innerHTML = TABS.map(function(o){
      return '<button class="tab" role="tab" data-k="'+esc(o.k)+'" aria-selected="'+(o.k===tab)+'">'+
        esc(o.t)+'<span class="n">'+tabCount(o.k)+'</span></button>';
    }).join('');
  }
  tabsEl.addEventListener('click', function(e){
    var b = e.target.closest('.tab'); if (!b) return;
    tab = b.dataset.k; paintTabs(); render();
    document.getElementById('list').scrollIntoView({block:'start'});
  });

  /* ---- search box ---- */
  var qEl = document.getElementById('q'), sw = document.getElementById('searchWrap');
  qEl.addEventListener('input', function(){ sw.classList.toggle('has', !!qEl.value); render(); });
  document.getElementById('clrBtn').addEventListener('click', function(e){
    e.preventDefault(); qEl.value = ''; sw.classList.remove('has'); render(); qEl.focus();
  });
  document.getElementById('filtBtn').addEventListener('click', function(){
    var fs = document.getElementById('fs'); fs.hidden = !fs.hidden;
    this.textContent = fs.hidden ? '상세 필터' : '필터 닫기';
  });

  /* ---- list ---- */
  function match(r){
    var q = qEl.value.trim().toLowerCase();
    if (q && r._s.indexOf(q) < 0) return false;
    if (tab === 'star') { if (!S.star[r.n]) return false; }
    else if (tab && r.pr !== tab) return false;
    if (fCt.value && r.ct !== fCt.value) return false;
    if (fCat.value && r.cat !== fCat.value) return false;
    if (fRev.value && r.rev !== fRev.value) return false;
    if (fFit.value && r.fit !== fFit.value) return false;
    if (fAdv.value && r.adv !== fAdv.value) return false;
    if (fSt.value) {
      var st = S.status[r.n] || 'none';
      if (fSt.value !== st) return false;
    }
    return true;
  }
  var shown = [];
  function render(){
    shown = ROWS.filter(match);
    var key = ROWS.filter(function(r){ return r.pr === '반드시' || r.pr === '우선'; });
    var deepAll = key.length;
    var deepDone = key.filter(function(r){ return S.status[r.n] === 'done'; }).length;
    document.getElementById('count').textContent =
      shown.length + ' / ' + ROWS.length + '개사 · 반드시·우선 ' + deepDone + '/' + deepAll + ' 완료';
    var el = document.getElementById('list');
    if (!shown.length) { el.innerHTML = '<div class="empty">조건에 맞는 업체가 없습니다.<br>검색어나 필터를 지워보세요.</div>'; return; }
    el.innerHTML = shown.map(function(r){
      var st = S.status[r.n];
      return '<div class="row" data-p="'+esc(r.pr)+'"'+(HL[r.c]?' data-hl="1"':'')+'>'+
        '<button class="mid" data-open="'+esc(r.n)+'" aria-label="'+esc(r.c)+' 상세 열기">'+
          '<span class="idx">'+esc(r.n)+'</span>'+
          '<span class="bd">'+
            '<span class="nm">'+esc(r.c)+'</span>'+
            '<span class="meta">'+pill(r.pr, PCLS[r.pr]||'')+
              '<span>'+esc(r.ct)+'</span><span>'+esc(r.cat)+'</span></span>'+
            '<span class="tt">'+esc(r.tt)+'</span>'+
          '</span>'+
        '</button>'+
        '<span class="rt">'+
          '<button class="star" data-star="'+esc(r.n)+'" aria-pressed="'+(S.star[r.n]?'true':'false')+
            '" aria-label="'+esc(r.c)+' 즐겨찾기">'+(S.star[r.n]?'★':'☆')+'</button>'+
          (st ? '<span class="st '+esc(st)+'">'+STL[st]+'</span>' : '')+
        '</span>'+
      '</div>';
    }).join('');
  }
  document.getElementById('list').addEventListener('click', function(e){
    var s = e.target.closest('[data-star]');
    if (s) {
      var n = s.dataset.star;
      S.star[n] = !S.star[n]; if (!S.star[n]) delete S.star[n];
      save(); paintTabs();
      s.setAttribute('aria-pressed', S.star[n] ? 'true' : 'false');
      s.textContent = S.star[n] ? '★' : '☆';
      if (tab === 'star') render();
      return;
    }
    var o = e.target.closest('[data-open]');
    if (o) openDetail(o.dataset.open);
  });

  /* ---- detail ---- */
  var dt = null, savedY = 0;
  function byNo(n){ for (var i=0;i<ROWS.length;i++) if (ROWS[i].n === n) return ROWS[i]; return null; }
  function closeDetail(){
    if (!dt) return;
    dt.remove(); dt = null;
    document.body.style.overflow = '';
    render();
    window.scrollTo(0, savedY);
  }
  function openDetail(n){
    var r = byNo(n); if (!r) return;
    if (dt) { dt.remove(); dt = null; } else { savedY = window.scrollY || 0; }
    var idx = shown.indexOf(r), nxt = idx >= 0 && idx + 1 < shown.length ? shown[idx+1] : null;
    var chk = S.chk[n] || {};
    var h = '';
    h += '<div class="dt-top"><button class="back" id="backBtn">‹ 목록</button>'+
         '<span class="lbl">'+esc(r.n)+' / '+ROWS.length+'</span>'+
         '<button class="star" data-dstar="'+esc(n)+'" style="margin-left:auto" aria-pressed="'+
         (S.star[n]?'true':'false')+'" aria-label="즐겨찾기">'+(S.star[n]?'★':'☆')+'</button></div>';
    h += '<div class="dt-body">';
    h += '<h1>'+esc(r.c)+'</h1><div class="chips">'+pill(r.pr, PCLS[r.pr]||'')+
         pill(r.cat)+pill(r.rev)+(r.deep?pill('상세 준비','deep'):'')+'</div>';
    h += '<dl class="kv">'+
         '<dt>국가</dt><dd>'+esc(r.ct)+' · '+esc(r.rg)+'</dd>'+
         '<dt>장르 적합도</dt><dd>'+esc(r.fit)+' · 광고수익화 '+esc(r.adv)+'</dd>'+
         '<dt>주요 타이틀</dt><dd>'+esc(r.tt)+'</dd></dl>';
    h += '<div class="sec"><span class="lbl">왜 만나는가</span><p>'+esc(r.why)+'</p>'+
         (r.purpose ? '<details class="fold"><summary>미팅 목적 전문</summary><p>'+esc(r.purpose)+'</p></details>' : '')+
         '</div>';
    if (r.ice || r.agenda) {
      var steps = [
        ['01', '아이스브레이킹', r.ice, 0],
        ['02', '위메이드플레이 소개', D.intro, 1],
        ['03', '상호 논의형 아젠다', r.agenda, 0]
      ];
      h += '<div class="sec"><span class="lbl">미팅 진행 스크립트</span><ol class="fl">';
      steps.forEach(function(st){
        if (!st[2]) return;
        h += '<li><span class="step">'+st[0]+'</span><span><span class="sl">'+esc(st[1])+'</span>'+
             '<span class="tx">'+esc(st[2])+'</span>'+
             (st[3] ? '<button class="cp" data-cp="'+esc(st[2])+'">COPY</button>' : '')+
             '</span></li>';
      });
      h += '</ol></div>';
    }
    if (r.qs.length) {
      h += '<div class="sec"><span class="lbl">핵심 질문 '+
           '<span style="text-transform:none;letter-spacing:0;font-weight:500">· 눌러서 체크</span></span><ul class="qs">';
      r.qs.forEach(function(q, i){
        h += '<li class="q" data-on="'+(chk[i]?'1':'0')+'"><button class="qt" data-chk="'+i+'">'+
             '<span class="box" aria-hidden="true">✓</span><span>'+
             (q[0] ? '<span class="qtag">'+esc(q[0])+'</span>' : '')+
             '<span class="qx">'+esc(q[1])+'</span></span></button></li>';
      });
      h += '</ul>';
      if (r.exp) h += '<details class="fold"><summary>예상 답변 · 확인 포인트</summary><p>'+esc(r.exp)+'</p></details>';
      if (r.how) h += '<details class="fold"><summary>진행 방식</summary><p>'+esc(r.how)+'</p></details>';
      h += '</div>';
    }
    if (r.ask) h += '<div class="sec"><span class="lbl">미팅 후 확보할 결과물</span><p>'+esc(r.ask)+'</p></div>';
    if (r.en.length) {
      h += '<div class="sec"><span class="lbl">현장용 영문 질문</span><ul class="en">';
      r.en.forEach(function(s){
        h += '<li><q>'+esc(s)+'</q><button class="cp" data-cp="'+esc(s)+'">COPY</button></li>';
      });
      h += '</ul></div>';
    }
    if (r.note) h += '<div class="sec"><span class="lbl">참고</span><p>'+esc(r.note)+'</p>'+
      '<details class="fold"><summary>정보 신뢰 수준</summary><p>지역 '+esc(r.geo)+' · 매출 '+esc(r.lvl)+'</p></details></div>';
    h += '<div class="sec"><span class="lbl">현장 메모</span>'+
         '<textarea class="memo" id="memo" placeholder="담당자 이름, 약속한 후속 과제, 들은 숫자를 바로 적어두세요">'+
         esc(S.memo[n]||'')+'</textarea>'+
         '<div class="sts">'+
           ['plan','done','hold'].map(function(k){
             return '<button data-st="'+k+'" aria-pressed="'+((S.status[n]===k)?'true':'false')+'">'+STL[k]+'</button>';
           }).join('')+
         '</div></div>';
    h += '</div>';
    h += '<div class="dt-bar"><span class="saved" id="savedMsg">'+
         (S.memo[n] ? '메모 저장됨' : '')+'</span>'+
         (nxt ? '<button class="nx" data-open="'+esc(nxt.n)+'">다음 '+esc(nxt.c.slice(0,14))+' ›</button>'
              : '<button class="st2" id="backBtn2">목록으로</button>')+'</div>';

    dt = document.createElement('div');
    dt.className = 'dt'; dt.setAttribute('role','dialog'); dt.setAttribute('aria-label', r.c);
    dt.innerHTML = h;
    document.body.appendChild(dt);
    document.body.style.overflow = 'hidden';
    dt.scrollTop = 0;

    dt.addEventListener('click', function(e){
      var t = e.target;
      if (t.closest('#backBtn') || t.closest('#backBtn2')) { closeDetail(); return; }
      var op = t.closest('[data-open]'); if (op) { openDetail(op.dataset.open); return; }
      var ds = t.closest('[data-dstar]');
      if (ds) {
        S.star[n] = !S.star[n]; if (!S.star[n]) delete S.star[n];
        save(); paintTabs();
        ds.setAttribute('aria-pressed', S.star[n]?'true':'false');
        ds.textContent = S.star[n] ? '★' : '☆';
        return;
      }
      var c = t.closest('[data-chk]');
      if (c) {
        var i = c.dataset.chk, li = c.closest('.q');
        chk[i] = !chk[i]; if (!chk[i]) delete chk[i];
        if (Object.keys(chk).length) S.chk[n] = chk; else delete S.chk[n];
        li.dataset.on = chk[i] ? '1' : '0'; save(); return;
      }
      var cp = t.closest('[data-cp]');
      if (cp) {
        var txt = cp.dataset.cp;
        var done = function(){ cp.textContent = 'COPIED'; cp.classList.add('ok');
          setTimeout(function(){ cp.textContent='COPY'; cp.classList.remove('ok'); }, 1400); };
        try {
          navigator.clipboard.writeText(txt).then(done, function(){ selectText(cp); });
        } catch(err){ selectText(cp); }
        return;
      }
      var st = t.closest('[data-st]');
      if (st) {
        var k = st.dataset.st;
        if (S.status[n] === k) delete S.status[n]; else S.status[n] = k;
        save();
        dt.querySelectorAll('[data-st]').forEach(function(b){
          b.setAttribute('aria-pressed', S.status[n] === b.dataset.st ? 'true' : 'false');
        });
        return;
      }
    });
    function selectText(btn){
      var li = btn.closest('li'), q = li.querySelector('q, .tx');
      var rg = document.createRange(); rg.selectNodeContents(q);
      var sel = getSelection(); sel.removeAllRanges(); sel.addRange(rg);
      btn.textContent = '선택됨';
      setTimeout(function(){ btn.textContent = 'COPY'; }, 1600);
    }
    var memo = dt.querySelector('#memo'), msg = dt.querySelector('#savedMsg');
    memo.addEventListener('input', function(){
      if (memo.value.trim()) S.memo[n] = memo.value; else delete S.memo[n];
      save(); msg.textContent = '메모 저장됨';
    });
  }
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape') closeDetail(); });

  /* ---- bottom sheet (export / intro script) ---- */
  function openSheet(title, hint, text){
    var ov = document.createElement('div');
    ov.className = 'ov';
    ov.innerHTML = '<div class="pane"><h2>'+esc(title)+'</h2>'+
      '<p class="hint">'+esc(hint)+'</p>'+
      '<textarea id="expTa" readonly></textarea>'+
      '<div class="acts"><button class="prim" id="cpAll">전체 복사</button>'+
      '<button class="sec2" id="ovClose">닫기</button></div></div>';
    document.body.appendChild(ov);
    ov.querySelector('#expTa').value = text;
    ov.addEventListener('click', function(e){
      if (e.target === ov || e.target.closest('#ovClose')) { ov.remove(); return; }
      if (e.target.closest('#cpAll')) {
        var ta = ov.querySelector('#expTa'), b = e.target.closest('#cpAll');
        var ok = function(){ b.textContent = '복사됨'; setTimeout(function(){ b.textContent='전체 복사'; },1500); };
        try { navigator.clipboard.writeText(ta.value).then(ok, function(){ ta.select(); }); }
        catch(err){ ta.select(); }
      }
    });
  }
  document.getElementById('introBtn').addEventListener('click', function(){
    openSheet('위메이드플레이 소개', '어느 미팅에서나 쓰는 공통 소개 문안입니다. 시트 T열 기준.', D.intro);
  });
  document.getElementById('expBtn').addEventListener('click', function(){
    var lines = [];

      var st = S.status[r.n], m = S.memo[r.n], stars = S.star[r.n];
      if (!st && !m && !stars) return;
      lines.push('[' + r.n + '] ' + r.c + (stars ? ' ★' : '') + (st ? ' · ' + STL[st] : ''));

    openSheet('메모 내보내기',
      '이 브라우저에 저장된 ★·상태·메모입니다. 전체 선택 후 복사해 시트나 메신저에 붙여넣으세요.',
      lines.length ? lines.join('\n') : '아직 기록한 메모·상태가 없습니다.');
  });

  /* ---- 구글문의 ---- */
